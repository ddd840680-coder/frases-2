name: Apply patches

on:
  push:
    paths:
      - 'patches/pending/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patches
        run: node scripts/apply-patches.js

      - name: Bump SW version
        run: |
          if git diff --name-only | grep -q '^index.html$'; then
            node scripts/bump-sw.js
          else
            echo "index.html не менялся — sw.js не трогаю"
          fi

      - name: Commit & push
        run: |
          git config user.name  "patcher-bot"
          git config user.email "patcher-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
          else
            git commit -m "auto: применить патчи"
            git push
          fi
