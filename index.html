<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f0" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Карточки">
<meta name="application-name" content="Карточки">
<title>Карточки</title>
<style>
:root{
  --bg:#faf7f2;--bg2:#f4ede4;--card:#fff;--ink:#2b2538;--ink2:#5a5370;--mute:#8a82a0;
  --a:#b8a5e8;--a-d:#9b86d6;--b:#9dd9c8;--c:#f5b8c5;--d:#f3d99a;--line:#eee6df;--line2:#e5dcd2;
  --ok:#3f9b7a;--ok-l:#e8f5ef;--bad:#d46a85;
  --shadow-sm:0 1px 2px rgba(60,40,90,.05),0 1px 3px rgba(60,40,90,.03);
  --shadow:0 2px 6px rgba(60,40,90,.05),0 4px 14px rgba(60,40,90,.06);
  --shadow-lg:0 8px 24px rgba(60,40,90,.10),0 2px 6px rgba(60,40,90,.04);
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:26px;
  --pad:16px;
  --nav-w:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131f;--bg2:#1c1929;--card:#221f31;--ink:#f2edff;--ink2:#c5bede;--mute:#8d85a8;
  --a:#8f75d4;--a-d:#a48ce6;--b:#4a9c83;--c:#a45c72;--d:#a58638;--line:#2e2a41;--line2:#3a3552;
  --ok:#6fd0aa;--ok-l:#1d3a30;--bad:#f08aa5;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#15131f;--bg2:#1c1929;--card:#221f31;--ink:#f2edff;--ink2:#c5bede;--mute:#8d85a8;
  --a:#8f75d4;--a-d:#a48ce6;--b:#4a9c83;--c:#a45c72;--d:#a58638;--line:#2e2a41;--line2:#3a3552;
  --ok:#6fd0aa;--ok-l:#1d3a30;--bad:#f08aa5;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}

/* === LAYOUT === */
.app{display:block;min-height:100vh}
.sidenav{display:none}
.main{padding:0 16px 96px;max-width:100%}
.main-inner{max-width:720px;margin:0 auto}
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);
  display:flex;justify-content:space-around;align-items:stretch;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -2px 16px rgba(60,40,90,.08);
  z-index:6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottomnav{box-shadow:0 -2px 16px rgba(0,0,0,.4)}}
:root[data-theme="dark"] .bottomnav{box-shadow:0 -2px 16px rgba(0,0,0,.4)}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border:0;background:transparent;font:inherit;cursor:pointer;
  color:var(--mute);font-size:10.5px;border-radius:12px;
  transition:color .15s,background .15s;position:relative;
}
.bn-item:active{background:var(--line)}
.bn-item.on{color:var(--ink);font-weight:600}
.bn-item.on::before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--a);border-radius:2px}
.bn-item .ico{font-size:20px;line-height:1}
.bn-badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--a);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;min-width:16px;text-align:center}

@media (min-width:820px){
  .app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
  .sidenav{display:flex}
  .bottomnav{display:none}
  .main{padding:0 32px 40px}
  .drw-btn{display:none}
}
.drw-btn{
  border:0;background:transparent;font:inherit;font-size:22px;cursor:pointer;
  padding:8px 10px;border-radius:12px;color:var(--ink);line-height:1;
}
.drw-btn:active{background:var(--line)}

/* === SIDEBAR === */
.sidenav{
  flex-direction:column;gap:2px;
  background:var(--card);
  padding:20px 12px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  box-shadow:1px 0 0 var(--line);
}
.nav-title{font-size:16px;font-weight:700;padding:8px 14px 16px;color:var(--ink);display:flex;align-items:center;gap:8px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 14px;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);
  cursor:pointer;border-radius:12px;text-align:left;transition:background .12s;
}
.nav-item:hover{background:var(--line)}
.nav-item:active{background:var(--line2)}
.nav-item.on{background:var(--a);color:#fff;font-weight:600;box-shadow:var(--shadow-sm)}
.nav-item .ico{width:20px;text-align:center;font-size:17px;line-height:1}
.nav-item .badge{margin-left:auto;background:var(--line);color:var(--ink2);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;min-width:22px;text-align:center}
.nav-item.on .badge{background:rgba(255,255,255,.25);color:#fff}
.nav-item.install{background:var(--ok);color:#fff;margin-top:8px}
.nav-sep{height:1px;background:var(--line);margin:12px 6px}
.nav-sep-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 14px 4px;font-weight:600}

/* === DRAWER (mobile) === */
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:280px;max-width:86vw;
  background:var(--card);z-index:11;
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.34,1.1,.64,1);
  box-shadow:var(--shadow-lg);
  padding:20px 12px;overflow-y:auto;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
}
.drawer.open{transform:translateX(0)}
@media (min-width:820px){.drawer{display:none}}
.overlay{
  position:fixed;inset:0;background:rgba(20,15,35,.45);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.overlay.open{opacity:1;pointer-events:auto}
@media (min-width:820px){.overlay{display:none}}

/* === HEADER === */
.hdr{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.hdr h1{font-size:20px;margin:0;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:8px}

/* === RING === */
.ring-wrap{width:44px;height:44px;position:relative;flex-shrink:0}
.ring{display:block}
.ring circle{transition:stroke-dasharray .4s ease}
.ring text{font-family:inherit}

/* === CONTENT === */
.content{padding-bottom:8px}
.row{display:flex;gap:10px;margin-top:14px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mode.center{justify-content:center}

/* === BUTTONS === */
.btn,.chip,.tab{border:0;font:inherit;cursor:pointer;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .15s,box-shadow .15s}
.btn:active,.chip:active,.tab:active{transform:scale(.96)}
.btn{
  flex:1;padding:13px 8px;border-radius:var(--r);background:var(--a);color:#fff;font-weight:600;
  min-height:48px;box-shadow:var(--shadow-sm);
}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.btn.b0{background:var(--c);color:var(--ink)}
.btn.b1{background:var(--d);color:var(--ink)}
.btn.b2{background:var(--b);color:var(--ink)}
.btn.b3{background:var(--a);color:#fff}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
.chip{
  padding:7px 15px;border-radius:20px;background:var(--card);font-size:13px;min-height:34px;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);
}
.chip.on{background:var(--b);color:var(--ink);font-weight:600}
.chip.install{background:var(--ok);color:#fff;font-weight:600}

/* === INPUTS === */
input[type=text],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid transparent;
  border-radius:var(--r-sm);padding:11px 14px;margin-top:6px;
  transition:border .15s,background .15s;
}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--a);background:var(--card)}

/* === CARD (review) === */
.card{
  background:var(--card);border-radius:var(--r-xl);padding:28px 22px;min-height:220px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;
  box-shadow:var(--shadow);
  animation:slideUp .26s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flipIn{from{opacity:.5;transform:rotateY(70deg)}to{opacity:1;transform:rotateY(0)}}
.flip-anim{animation:flipIn .32s cubic-bezier(.22,1,.36,1);transform-origin:center}
.tag{font-size:12px;color:var(--mute);letter-spacing:.01em}
.big{font-size:26px;font-weight:700;line-height:1.3}
.big.sm{font-size:20px;color:var(--ok);font-weight:600}
.ex{color:var(--mute);font-size:15px;line-height:1.5}
.empty{text-align:center;padding:40px 20px}
.empty .big{font-size:24px;margin-bottom:6px}

/* === ITEMS / TILES === */
.tile{
  background:var(--card);border-radius:var(--r);padding:14px 16px;
  margin-bottom:10px;box-shadow:var(--shadow-sm);
  transition:transform .12s,box-shadow .15s;
  animation:slideUp .22s ease-out;
}
.tile:active{transform:scale(.985)}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.tile-en{font-size:17px;font-weight:700;line-height:1.3;word-break:break-word}
.tile-ru{color:var(--ink2);font-size:14px;margin-bottom:4px;line-height:1.4}
.tile-meta{font-size:11.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tile-meta .badge{background:var(--line);padding:1px 8px;border-radius:8px;font-weight:600}
.tile-actions{display:flex;gap:6px;flex-shrink:0}
.tile-actions .chip{padding:4px 8px;font-size:13px;min-height:28px;box-shadow:none;background:var(--bg2)}
.item{
  background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;
  display:flex;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm);
}
.item small{color:var(--mute)}
.lv{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--line);color:var(--ink2);white-space:nowrap;align-self:flex-start;font-weight:600}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.acts .chip{padding:4px 9px;min-height:28px;background:var(--bg2);box-shadow:none}

/* === SUMMARY / DETAILS === */
details{
  background:var(--card);border-radius:var(--r);padding:0 16px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);overflow:hidden;
}
details > summary{
  cursor:pointer;padding:14px 0;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;
}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"›";font-size:22px;color:var(--mute);transition:transform .2s;transform:rotate(90deg);line-height:1}
details[open] > summary::after{transform:rotate(-90deg)}
details > *:not(summary){padding-bottom:14px}
details[open] > summary{padding-bottom:10px}

/* === STATS === */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:var(--r);padding:12px 6px;text-align:center;box-shadow:var(--shadow-sm)}
.st b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.st span{font-size:11px;color:var(--mute);display:block;margin-top:4px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-bottom:16px}
.bar i{display:block;transition:width .35s ease}
.today{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.today b{color:var(--ink);font-weight:700}
.session{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--mute)}
.session-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.session-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--ok));transition:width .4s ease;border-radius:4px}
.chart{display:flex;gap:4px;align-items:flex-end;background:var(--card);border-radius:var(--r);padding:14px 10px 6px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:104px}
.cb i{display:block;width:100%;max-width:22px;background:var(--a);border-radius:6px 6px 0 0;min-height:3px;transition:height .35s}
.cb span{font-size:10px;color:var(--mute);text-align:center;line-height:1.2;margin-top:4px}
.cal{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;gap:3px;margin-bottom:14px;overflow-x:auto;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow-sm)}
.cal i{display:block;width:15px;height:15px;border-radius:4px;transition:transform .12s}
.cal i:hover{transform:scale(1.25)}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
.tb th,.tb td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tb th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.ach{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ach-item{padding:7px 12px;background:var(--card);border-radius:11px;font-size:12px;box-shadow:var(--shadow-sm);transition:transform .15s}
.ach-item.on{background:var(--d);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.ach-item.off{opacity:.42}
.rep-preview{font-size:12px;color:var(--mute);margin-top:8px;min-height:10px}
.rep-item{padding:3px 9px;background:var(--c);border-radius:8px;display:inline-block;margin:3px;color:var(--ink);font-weight:500}
.smart{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bulk-bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--card);border-radius:var(--r);margin-bottom:10px;align-items:center;box-shadow:var(--shadow-sm)}
.wr{background:var(--d);padding:12px 14px;border-radius:var(--r);color:var(--ink);font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--shadow-sm);animation:slideUp .3s ease}
.note{color:var(--mute);font-size:13px;margin:10px 2px}
.fld{margin-bottom:10px}
.fld label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
.my{margin-top:10px;text-align:left}
.my label{font-size:12px;color:var(--mute);font-weight:600}
.ans{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:38px;margin:8px 0}
.dup-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bl{display:inline-block;border-bottom:2px solid var(--a);color:transparent;min-width:3em;user-select:none}

/* === TOAST === */
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13.5px;
  opacity:0;transition:opacity .22s,transform .22s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  z-index:20;max-width:88vw;text-align:center;box-shadow:var(--shadow-lg);font-weight:500;
}
@media (min-width:820px){.toast{bottom:28px}}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* === PROFILE CHIPS (в drawer) === */
.prof-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 8px}
.prof-chips .chip{padding:5px 11px;font-size:12px;min-height:28px}
</style>
</head><body>

ню (десктоп) + нижняя панель (мобилка) + drawer ☰.\n- Режимы: Узнать, Написать, Диктант, Собрать (сборка c.en), Выбор, Микс.\n- Смарт-колоды: 🔥 Трудные, 🩸 Пиявки, ⭐ Избранные, 🆕 Новые, 📭 Забытые, 1️⃣ Однословные, 🧩 Идиомы, 🔤 Глаголы.\n- Массовое редактирование, ачивки, отчёты, авто-бэкап, валидация JSON.\n- Папки: три формата — `Folder::Item`, `Folder Item 1`, `Folder 1`.\n- Дубликаты: точные + 1 опечатка + слияние «Объединить».\n- Прогресс-кольцо, аккордеон в статистике, тёмная тема.\n- Резерв: JSON, для Anki (TSV).\n";
