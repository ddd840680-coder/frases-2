*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain}
body.drawer-open{overflow:hidden}
.app{display:block;min-height:100vh}
.sidenav{display:none}
.main{padding:0 16px 96px;max-width:100%}
.main-inner{margin:0 auto}
.bottomnav{position:fixed;align-items:stretch;z-index:6;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}.bottomnav::-webkit-scrollbar{display:none}


@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav-item.on{color:#1a1724}}
:root[data-theme="dark"] .btn:not(.ghost):not(.b0):not(.b1):not(.b2):not(.b3){color:#1a1724}
:root[data-theme="dark"] .nav-item.on{color:#1a1724}

.nav-item.install{color:#102c1b}
.bn-item{display:flex;flex-direction:column;align-items:center;padding:8px 2px 4px;border:0;font:inherit;cursor:pointer;position:relative}

.bn-item.on::before{content:"";position:absolute;left:50%;transform:translateX(-50%);}
.bn-item .ico{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.bn-item svg{width:22px;height:22px}
.bn-badge{position:absolute;top:1px;right:calc(50% - 24px);background:var(--acc);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;min-width:16px;text-align:center}
@media (min-width:820px){.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}.sidenav{display:flex}.drw-btn{display:none}}
.drw-btn{border:0;background:transparent;font:inherit;cursor:pointer;padding:8px;color:var(--ink);line-height:1;display:flex;align-items:center;justify-content:center}
.drw-btn:active{background:var(--line)}
.drw-btn svg{width:22px;height:22px}
.sidenav{flex-direction:column;background:var(--card);position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:1px 0 0 var(--line)}
.nav-title{padding:8px 14px 16px;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:var(--acc-tint);color:var(--acc-d);flex:none}.brand-mark svg{width:18px;height:18px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;transition:background .12s}
.nav-item:hover{background:var(--line)}
.nav-item:active{background:var(--line2)}
.nav-item.on{background:var(--acc);font-weight:600;box-shadow:var(--shadow-sm)}
.nav-item .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--line);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;min-width:22px;text-align:center}
.nav-item.on .badge{background:rgba(255,255,255,.28)}
.nav-item.install{background:var(--ok);margin-top:8px}
.nav-sep{height:1px;}
.nav-sep-title{text-transform:uppercase;color:var(--mute);padding:8px 14px 4px;font-weight:600}
.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:86vw;background:var(--card);z-index:11;transform:translateX(-100%);transition:transform .24s cubic-bezier(.34,1.1,.64,1);box-shadow:var(--shadow-lg);padding:20px 12px;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.drawer.open{transform:translateX(0)}
@media (min-width:820px){.drawer{display:none}}
.overlay{position:fixed;inset:0;background:rgba(30,20,15,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.overlay.open{opacity:1;pointer-events:auto}
@media (min-width:820px){.overlay{display:none}}
.hdr{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:5}
.hdr h1{margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ring-wrap{width:56px;height:56px;position:relative;flex-shrink:0}
.ring{display:block;width:56px;height:56px}
.ring circle{transition:stroke-dasharray .4s ease}
.content{padding-bottom:8px}
.row{display:flex;margin-top:14px}
.mode{display:flex;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.mode.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:flex-start}
.mode.scroll::-webkit-scrollbar{display:none}
.btn,.chip,.tab{border:0;font:inherit;cursor:pointer;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .16s ease-out,background .15s,box-shadow .15s,color .15s}
.btn:active,.chip:active,.tab:active{transform:scale(.93);filter:brightness(.94);transition-duration:.03s}
.btn{flex:1;padding:13px 8px;background:var(--acc);color:#fff;}





.btn small{display:block;font-weight:400;margin-top:2px}
.btn kbd{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.12);margin-left:4px;font-family:inherit;font-weight:600;opacity:.75}
.chip{padding:7px 15px;font-size:13px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;flex-shrink:0}

.chip.install{font-weight:600;border-color:transparent}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);margin-top:6px;transition:border .15s,background .15s}
input[type=text]:focus,textarea:focus,select:focus{outline:none}
.card{background:var(--card);min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:var(--shadow);animation:slideUp .26s cubic-bezier(.22,1,.36,1)}
.swipe-card{touch-action:pan-y;will-change:transform;backface-visibility:hidden;-webkit-user-select:none;user-select:none}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flipIn{from{opacity:.5;transform:rotateY(70deg)}to{opacity:1;transform:rotateY(0)}}
.flip-anim{animation:flipIn .32s cubic-bezier(.22,1,.36,1);transform-origin:center}

.big{font-size:26px;}
.big.sm{font-size:20px;font-weight:600}
.ex{color:var(--mute);line-height:1.5}
.empty{text-align:center;padding:30px 20px}
.empty-state{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:slideUp .3s ease}
.empty-emoji{width:84px;height:84px;background:var(--acc-tint);display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1;margin-bottom:2px}.empty-emoji svg{width:42px;height:42px;stroke:currentColor;fill:none}
.empty-title{font-size:20px;font-weight:700;color:var(--ink);line-height:1.3}
.empty-text{color:var(--mute);font-size:14px;line-height:1.5;max-width:340px}
.tile{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s;animation:slideUp .22s ease-out}
.tile:active{transform:scale(.985)}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.tile-en{line-height:1.3;word-break:break-word}
.tile-ru{font-size:14px;margin-bottom:4px;line-height:1.4}
.tile-meta{font-size:11.5px;color:var(--mute);display:flex;flex-wrap:wrap;align-items:center}
.tile-meta .badge{background:var(--line);font-weight:600}
.tile-meta .st-new{background:var(--line)}


.tile-meta .st-mature{font-weight:700}

.tile-actions{display:flex;gap:6px;flex-shrink:0}
.tile-actions .chip{padding:5px 9px;font-size:13px;min-height:30px;color:var(--ink2);border-color:transparent}
.tile-actions .chip svg{width:15px;height:15px;display:block}
.item{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm)}
.item small{color:var(--mute)}
.lv{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--line);color:var(--ink2);white-space:nowrap;align-self:flex-start;font-weight:600}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.acts .chip{padding:4px 9px;min-height:28px;background:var(--bg2);box-shadow:none}
details{background:var(--card);border-radius:var(--r);padding:0 16px;margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--line)}
details > summary{cursor:pointer;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
details[open] > summary::after{transform:rotate(45deg);margin-top:-3px}
details > *:not(summary){padding-bottom:14px}
details[open] > summary{padding-bottom:10px}details > details{padding:0 12px;background:var(--bg2);box-shadow:none;border-color:transparent;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:var(--r);text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.st b{display:block;line-height:1.1;font-weight:800}
.st span{color:var(--mute);display:block;margin-top:4px}
.bar{display:flex;height:10px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;transition:width .35s ease}
.session{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--mute)}
.session-bar{flex:1;overflow:hidden}
.session-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s ease;}
.chart{display:flex;gap:4px;align-items:flex-end;background:var(--bg2);border-radius:var(--r);padding:14px 10px 6px;margin-bottom:12px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:104px}
.cb i{display:block;width:100%;max-width:22px;background:var(--acc);min-height:3px;transition:height .35s}
.cb span{font-size:10px;color:var(--mute);text-align:center;line-height:1.2;margin-top:4px}
.cal{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;gap:3px;margin-bottom:14px;overflow-x:auto;background:var(--bg2);border-radius:var(--r);padding:12px}
.cal i{display:block;width:15px;height:15px;border-radius:4px;transition:transform .12s}
.cal i:hover{transform:scale(1.25)}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
.tb th,.tb td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tb th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.ach{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ach-item{padding:7px 12px;background:var(--bg2);border-radius:11px;font-size:12px;transition:transform .15s;border:1px solid var(--line)}
.ach-item.on{background:var(--ach);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);border-color:transparent}
.ach-item.off{opacity:.42}

ском и английском; ИИ-промпт объясняет фразу в целом, без примера из карточки; добавлены кнопки просмотра объяснений в карточке, общий редактор промптов и унифицированы экраны массового обогащения. v15.12.4: массовое обогащение контекстными объяснениями в разделе «Добавить сразу много карточек»: фильтр колод, копирование списка и промпта, импорт по английской фразе без ID, выявление неоднозначностей, защита существующих объяснений и резервная копия до записи. v15.12.3: добавлены контекстные объяснения карточек, промпт для AI с копированием и локальный разбор ответа, редактирование объяснения и поиск по нему; уведомления и прямой AI API не добавлялись. v15.12.2: исправлены мобильная навигация и библиотека, выровнены интерактивные элементы прогресса и озвучивания, добавлены подтверждённый статус сохранения и локальная дата резервных копий. v15.12.1: проведена унификация поверхностей, градиентов, стеклянных слоёв и анимаций; расширен конструктор. v15.12.1: конструктор главного экрана получил рабочие размеры ширины, плотность, скругление, цветовые градиенты, силу градиента, рамку, тень, выравнивание, drag-and-drop и предпросмотр; жидкое стекло теперь меняет реальные CSS-поверхности; свободный режим запускается на чистом полноэкранном экране и возвращается в сворачиваемую нижнюю область; обзор получил выбор серии в шторке; окна и градиенты унифицированы, добавлены плавные переходы. v15.11.10: блоки главного экрана получили конструктор с изменением порядка, размера, цветовой темы и видимости; карточки режимов фокусировки и свободной практики стали интерактивными поверхностями с анимацией нажатия; настройки дневной цели переведены с браузерного prompt на стеклянную шторку; показатели количества карточек и коллекции в прогрессе открывают списки карточек. Статистика и шкала состояний всегда остаются в верхней области. v15.11.9: статистика и шкала состояний всегда остаются в верхней области и не зависят от режима изучения; выбор режима, свободного режима и фильтров колод/типов перенесён в нижние стеклянные шторки с подтверждением; свободный режим поддерживает последовательный и случайный порядок, а также выбор режимов; «Фокусировка» вынесена в самостоятельный блок с настраиваемым названием; выход из режима не вызывает системное подтверждение. v15.11.7: режимы учёбы и фильтры колод вынесены в отдельные нижние шторки; статистика перенесена ниже учебной карточки. Вложенные папки раскрываются на месте с неизменной иконкой; добавлен режим перетаскивания папок, настройка силы жидкого стекла, случайный порядок обзора и плавные переходы между вкладками. Учебный алгоритм, SCHEMA=3 и ключи хранения не менялись. v15.11.6: на экране учёбы убраны повторяющиеся входы в фокус-режим и тренировку трудных карточек; сокращён повтор индикатора прогресса. Service Worker и проверки приведены к версии релиза. v15.11.5: добавлен полноэкранный режим «Фокусировка» для повторения без навигации и статистики; оценка по-прежнему использует штатный алгоритм. v15.11.3: библиотека получила кнопку очистки текстового поиска, быстрый пресет «К повторению», переключатель избранного прямо на карточке и синхронизацию счётчика фильтров. v15.11.2: улучшена мобильная адаптация iPhone — убрано двойное применение нижней safe-area, увеличены ключевые сенсорные области, добавлены отступы прокрутки для полей под закреплённой шапкой. Учебная логика и формат данных не менялись. v15.11.1: добавлена техническая карта проекта и версия оболочки. v15.10: полный аудит визуальных слоёв и UI-иконок; единая палитра всех состояний, SVG вместо служебных эмодзи, исправлены недостающая SVG-иконка, тема браузера/PWA и очистка стека модальных окон. v15.9: унифицированы стеклянные поверхности и системная иконка; v15.8: жидко-стеклянная система палитр и всплывающих окон, SVG вместо служебных эмодзи и единые жесты шторок. v15.7: библиотека, папки и карточки получили расширенные действия и векторные иконки. v15.6: исправлены фокус поиска и кнопки возврата; папки и коллекции можно переименовывать и переносить по иерархии; обновлены стеклянные поверхности и жесты шторок. v15.4: улучшены формы карточек и массового импорта, подсказки существующих тегов, поиск с нижней шторкой примеров, нижняя закреплённая кнопка сохранения настроек и интерактивная статистика за 7/30/90 дней; библиотека получила вложенную навигацию по коллекциям и папкам со свайпом назад; практика разделена на плитки экзамена и разговорных сценариев; справка стала доступна через улучшенный поиск. v15.2: разделы открываются в мобильной нижней шторке со свайпом вниз; кнопки оценки в режиме «Узнать» доступны до раскрытия ответа. v15.1: исправлены сохранение введённого ответа при перерисовке практики, относительный счётчик сценариев и версия приложения; исправлен английский образец. v15.0: разговорная практика A2–B1 с 10 сценариями, озвучкой реплик, вводом ответа и голосовым вводом при поддержке браузера. v14.9: базовый FSRS-6, история повторений и улучшения навигации. v14.7: новая визуальная система Prism/Aurora — холодный фарфор, индиго, бирюзовые акценты, переработанные поверхности, навигация и анимации; v14.6: обновлённый iOS-inspired интерфейс со стеклянной навигацией, мягкими градиентами и анимациями; v14.5: свободный режим последовательно перебирает активные карточки без изменения расписания и статистики; снят фильтр выбора файлов, из-за которого некоторые мобильные системы скрывали .srt. v14: исправлены корзина, слияние и экспорт Anki; поиск по условиям, кириллице и тегам; сохранённые поиски; несколько примеров через « // »; fuzz и максимальный интервал; режим «Скажи»; запись голоса; удержание и время ответа; импорт CSV/TSV/Anki; «Поделиться копией»; напоминание .ics; режим «только карточка»; шторки с Esc и фокусом; самопроверка. v13: примеры в карточках (много контекстов, ротация, bottom-sheet), ИИ-цикл обогащения примерами, плашка «Доступна новая версия», расширенные фильтры поиска (state:, due:, lapses>, ex:, ease<). v12: озвучка списка на вкладке Перед, скрытые разделы настроек, кнопка «Раскрывать разделы», исправлен алгоритм переобучения, каскадная очистка прогресса. Ранее: подсветка раздела внизу и в меню работает, оценка появляется сразу после нажатия на карточку, «Мой пример» и «Заметка» свёрнуты, фокус-режим скрывает лишнее, свайп не срабатывает при вводе текста. Ранее: учёт просрочки как в Anki, счётчик пиявок, импорт .srt, слияние копий, корзина, авто-бэкапы, мягкий режим после перерыва, диагностика.</div></details>',t+="</details>",t+='<div class="settings-save-dock"><div id="msg" class="note" aria-live="polite"></div><div class="row"><button type="button" class="btn" data-a="saveSettingsForm">Сохранить настройки</button><button type="button" class="btn ghost" data-a="resetSettingsToDefaults">По умолчанию</button></div></div>',t}function El(e){if(!a.rafP){a.rafP=!0;var t=!1,r=function(){t||(t=!0,a.rafP=!1,a.rafFallback&&(clearTimeout(a.rafFallback),a.rafFallback=null),e())};typeof requestAnimationFrame=="function"?(requestAnimationFrame(r),a.rafFallback=setTimeout(r,50)):setTimeout(r,0)}}function Ve(){El(jl)}function Mo(){return a.hintEl?a.hintEl:(a.hintEl=document.getElementById("swipeHint"),a.hintEl?a.hintEl:(a.hintEl=document.createElement("div"),a.hintEl.id="swipeHint",document.body.appendChild(a.hintEl),a.hintEl))}function Cl(e){var t=Mo(),r=Math.abs(e),n,i,o;e>0?r>170?(n="easy",i="Легко",o=W.zap):(n="good",i="Хорошо",o=W.check):r>170?(n="hard",i="Трудно",o=W.alertTriangle):(n="again",i="Снова",o=W.undo),t.innerHTML='<span class="swipe-hint-icon" aria-hidden="true">'+o+"</span><span>"+i+"</span>",t.className="on "+n}function To(){a.hintEl&&(a.hintEl.className="")}function Al(e){if(!(!a.cur||a.tab!=="rev")&&zo()&&e.touches.length===1){var t=e.target.closest?e.target.closest(".swipe-card"):null;if(t&&!e.target.closest("input,textarea,select,.fold")){he.on=!0,he.el=t;var r=e.touches[0];he.x0=r.clientX,he.y0=r.clientY,he.dx=0,he.dy=0,he.lock=null,he.t0=Date.now(),t.style.transition="none",t.style.animation="none"}}}function Ml(e){if(he.on&&e.touc " data-v="all">📚 Открыть библиотеку</button><button type="button" data-a="addManual">＋ Создать карточку</button><button type="button" data-a="navigateTab" data-v="rev">🎯 Начать повторение</button><button type="button" data-a="navigateTab" data-v="ex">🎓 Открыть практику</button></div></div><div class="fld help-search"><label for="howSearch">Найти тему в справке</label><input type="search" id="howSearch" placeholder="Найдите тему: теги, импорт, FSRS…" autocomplete="off" enterkeyhint="search" aria-label="Поиск по справке"></div><div id="helpSearchStatus" class="note" style="margin-top:0">Введите ключевое слово; ненужные темы скроются.</div><details data-help-section><summary>📊 Список карточек по состояниям</summary><div class="note">На вкладке «Прогресс» нажмите число новых, обучающихся, молодых или зрелых карточек либо коллекцию, чтобы открыть список. Список загружается порциями по 100 карточек: кнопка «Показать ещё 100» добавляет следующую порцию, пока не будут показаны все результаты. Поиск работает по английской фразе и переводу; сортировка доступна по алфавиту, сроку повторения и сложности. Нажмите строку карточки, чтобы перейти к её редактированию в библиотеке. Счётчик «Показано N из M» отражает число совпадений текущего поиска.</div></details><details data-help-section><summary>🧭 Навигация и свайпы</summary><div class="note"><b>Библиотека</b> объединяет просмотр всех слов и добавление новых карточек. Нажмите «＋ Добавить» — откроется форма создания. Форму одной карточки и массовый импорт можно независимо сворачивать. Кнопка «Назад в библиотеку» возвращает к списку. В экране вложенного раздела проведите пальцем от левого края вправо, чтобы вернуться назад, если для текущего экрана есть предыдущий шаг. Для нижней шторки используйте вертикальный свайп вниз или кнопку ×. Нажатие на затемнение закрывает шторку; Esc закрывает её на клавиатуре. Если экран не вложенный, свайп от края может открывать меню навигации.</div></details><details data-help-section><summary>📚 Библиотека: поиск и фильтры</summary><div class="note"><b>Обычный поиск</b> ищет английскую фразу, русский перевод, примеры, заметки, тип, коллекцию и теги. Введите часть фразы, например <code>appointment</code>, или русский смысл. В запросах с несколькими условиями каждое условие должно совпасть. Поиск выполняется по всей библиотеке: при вводе запроса приложение возвращает из папок к общим результатам, чтобы ничего не скрыть. Примеры синтаксиса открываются нижней шторкой по нажатию на поле поиска или кнопку «Примеры поиска и фильтров». Кавычки ищут фразу целиком, например <code>"hang in there"</code>. Тег можно искать через <code>#work</code> или <code>тег:work</code>.<br><br><b>Быстрые фильтры</b> открываются кнопкой «Фильтры». В них можно выбрать коллекцию, статус, срок повторения, тип фразы и тег, а затем нажать «Применить фильтры». Они только скрывают неподходящие карточки, не меняя саму колоду и расписание. «Сбросить» возвращает все значения.<br><br><b>Примеры поисковых условий:</b><br><code>state:new</code> — новые карточки; <code>state:learn</code> — в обучении; <code>state:rev</code> — на повторении; <code>state:relearn</code> — переобучение; <code>due:overdue</code> — просроченные; <code>due:today</code> — срок сегодня; <code>due:week</code> — срок в ближайшую неделю; <code>колода:Charlie</code> — коллекция по названию; <code>тип:идиома</code>; <code>lapses&gt;2</code> — больше двух ошибок; <code>ivl&lt;=7</code> — интервал не больше недели; <code>has:ex</code> — есть примеры; <code>has:note</code> — есть заметка; <code>★</code> — избранное; <code>susp</code> — приостановленные карточки. Перед условием можно поставить минус, чтобы исключить результат, например <code>-тип:слово</code>. Кнопка «Сохранить поиск» сохраняет текстовый запрос.</div></details><details data-help-section><summary>🗂 Коллекции, папки и подколлекции</summary><div class="note">У каждой карточки есть коллекция — это имя, по которому сгруппированы слова. Для собственных фраз можно использовать «Мои карточки». Внутри раздела есть действия «Добавить в этот раздел» и «Новый подраздел», а в форме создания карточки коллекцию можно выбрать из списка или ввести самостоятельно. Чтобы организовать вложенность, задайте имя в формате <code>Мои карточки :: Работа</code>, <code>Английский :: Путешествия</code> или <code>Английский :: Работа :: Встречи</code>. Часть до разделителя <code>::</code> используется как родительская папка; полный путь остаётся названием коллекции. Новая коллекция или подраздел появляется после сохранения первой карточки. В библиотеке нажимайте на прямоугольник папки, чтобы войти внутрь, и на прямоугольник коллекции, чтобы открыть её карточки. Кнопка «Назад» возвращает на уровень выше; на телефоне также работает свайп от левого края вправо. Внутри раздела можно добавить карточку прямо в него или создать вложенный подраздел. Название коллекции можно изменить через действие «Переименовать» в раскрытой коллекции; отдельную карточку — через кнопку с карандашом. Папки являются путями группировки: перед массовым изменением их имён сначала проверьте, какие коллекции в них входят.</div></details><details data-help-section><summary>✍️ Создание одной карточки вручную</summary><div class="note">Откройте «Библиотека» → «＋ Добавить». В поле «Раздел / коллекция» оставьте «Мои карточки» или задайте свой путь. Введите английскую фразу и её естественный перевод — это обязательные поля. Пример лучше делать коротким и естественным, чтобы он показывал употребление фразы. Тип помогает группировать материал: слово, фраза, глагол/фразовый глагол, идиома или конструкция. Теги вводятся через пробел или запятую, например <code>работа, B1, разговор</code>. При вводе можно выбрать существующий тег из подсказок или нажать на тег-плашку под полем. «Мой пример» — предложение, которое вы составили сами; оно отличается от общего примера карточки. Нажмите «Сохранить карточку». После сохранения поля фразы и перевода очищаются, а коллекция остаётся прежней, чтобы можно было быстро добавить следующее выражение.<br><br>Для массового добавления раскройте «Добавить сразу много карточек». Каждая строка имеет формат <code>фраза | перевод | пример | тип | мой пример | сцена | теги</code>; обязательны первые два поля. Для самостоятельных карточек не обязательно указывать сцену.</div></details><details data-help-section><summary>📄 Субтитры, CSV и готовые списки</summary><div class="note">В форме добавления откройте блок «Добавить сразу много карточек». Импорт субтитров принимает SRT или текстовый файл, выделяет кандидатов-фраз и сохраняет таймкоды. Это автоматический подбор кандидатов, а не гарантированно идеальный анализ речи; просмотрите список и отметьте нужные выражения. «Скопировать для перевода» позволяет подготовить выбранные строки для внешнего переводчика или нейросети. CSV/TSV удобно использовать для готовых таблиц; проверьте сопоставление столбцов перед добавлением. Дубли с теми же фразой и коллекцией не должны случайно плодиться; если импортируете материал повторно, сначала проверьте список и повторяющиеся фразы.</div></details><details data-help-section><summary>🎯 Повторение и режимы карточек</summary><div class="note">Вкладка «Учиться» показывает карточки, которым пришло время повторения, с учётом лимитов и выбранных коллекций. В режиме «Узнать» сначала попробуйте вспомнить перевод; можно нажать на карточку, чтобы раскрыть ответ, или сразу оценить, если ответ уже знаете. «Снова» выбирайте, если не вспомнили; «Трудно» — если вспомнили, но с большим усилием; «Хорошо» — обычный уверенный ответ; «Легко» — мгновенное воспоминание без усилий. Не выбирайте «Легко» только потому, что ответ кажется знакомым: ориентируйтесь на реальное воспоминание.<br><br>Другие режимы: «Написать» — вспомнить английскую фразу по русскому смыслу; «Диктант» — прослушать и написать; «Собрать» — составить английскую фразу из слов; «Выбор» — выбрать вариант; «Скажи» — ответить голосом при поддержке браузера; «Микс» объединяет выбранные режимы. При оценке карточки расписание обновляется по выбранному алгоритму. Экзамен и разговорная практика отдельно не меняют расписание.</div></details><details data-help-section><summary>🧠 SM-2 и FSRS — расписание повторений</summary><div class="note">SM-2 оставлен для совместимости с прежним расписанием. Он рассчитывает следующий интервал на основе оценки, текущего интервала и коэффициента лёгкости. FSRS-6 — модель повторений, использующая оценку стабильности и сложности памяти; у него есть параметр желаемого удержания. Более высокое удержание обычно означает более частые повторы. При переключении алгоритма приложение не должно массово переносить все даты автоматически. Для старых карточек, у которых нет истории FSRS, начальное состояние оценивается приблизительно. Персональная оптимизация параметров по истории занятий не включена, поэтому не считайте текущие параметры индивидуально обученными под вас. Делайте резервную копию перед крупной настройкой.</div></details><details data-help-section><summary>🎓 Практика: экзамен и разговор</summary><div class="note">Раздел «Практика» начинается с двух отдельных карточек. <b>Экзамен по карточкам</b> использует слова из выбранных коллекций; можно настроить количество вопросов, тип заданий, таймер и показ правильного ответа. Результат сохраняется в истории экзаменов, но не меняет расписание повторений. <b>Разговорная практика</b> — сценарии уровня A2–B1: прослушайте реплику собеседника, попробуйте понять её без текста, ответьте по-английски устно или письменно, затем откройте образец и полезные конструкции. Самооценка сохраняет ощущение результата, но не является объективным тестом произношения или уровня. Озвучка использует системный синтез речи; качество голосов зависит от устройства. Голосовой ввод поддерживается не всеми браузерами и может требовать интернета и разрешения микрофона.</div></details><details data-help-section><summary>📖 Обзор и примеры</summary><div class="note">«Обзор» — режим чтения колоды: можно просматривать фразы, скрывать или показывать перевод, озвучивать список и отмечать избранное. Он подходит для предварительного знакомства с материалом и не должен заменять активное вспоминание при повторении. В карточке могут быть общий пример, несколько контекстных примеров, ваш собственный пример и заметка. Кнопка примеров открывает список, где их можно редактировать или добавлять. Старайтесь использовать разные и короткие контексты, а не запоминать только единственный перевод.</div></details><details data-help-section><summary>📈 Статистика и нагрузка</summary><div class="note">Прогресс показывает число повторений, успешность ответов, календарь активности и прогнозируемую очередь. Новые карточки и повторения — разная работа: добавление большого числа слов само по себе не означает, что они уже запомнены. Если ежедневно не успеваете справляться с повторениями, временно уменьшите лимит новых карточек. Регулярные короткие сессии полезнее редких марафонов. Показатели самооценки разговорной практики не объединяются с успешностью карточек.</div></details><details data-help-section><summary>💾 Резервные копии и восстановление</summary><div class="note">Данные хранятся локально в браузере; это не автоматически синхронизируемое облако. Регулярно скачивайте JSON-копию в «Настройки» → «Данные». Функция «Объединить файл» добавляет новые карточки и выбирает более свежий прогресс; восстановление с заменой перезаписывает текущие данные, поэтому перед ним обязательно сделайте отдельную копию. В приложении доступны авто-бэкапы и отмена некоторых операций — их возможности зависят от сохранности хранилища браузера. Не удаляйте данные сайта и IndexedDB, если хотите сохранить прогресс. Профили позволяют отделять настройки и учебную историю, но не заменяют резервную копию.</div></details><details data-help-section><summary>📴 Работа офлайн и установка</summary><div class="note">Для устойчивой офлайн-работы откройте приложение на поддерживаемом HTTPS-хостинге и дождитесь активации Service Worker, затем запустите его ещё раз при наличии сети. Сам HTML-файл, открытый как <code>file://</code>, не может регистрировать Service Worker в обычном режиме, хотя отдельные функции могут работать локально. Повторение карточек и сохранённые данные доступны без сети после корректной установки и кэширования. Голосовой ввод, загрузка внешних материалов и некоторые возможности браузера могут требовать подключения. После обновления заменяйте и <code>index.html</code>, и <code>sw.js</code>, перезапускайте установленное приложение и не очищайте данные сайта.</div></details><details data-help-section><summary>⚙️ Настройки, профили и защита данных</summary><div class="note">В настройках выбирается SM-2 или FSRS-6, желаемое удержание, лимиты новых и повторов, шаги обучения, режим оформления, озвучка, вибрация, авто-бэкап и мягкий режим после перерыва. Меняйте настройки алгоритма осознанно: они влияют на расписание будущих оценок. Профили позволяют отдельно хранить настройки и учебный прогресс разных пользователей на этом устройстве; коллекции карточек в общем наборе могут использоваться несколькими профилями. В разделе надёжности есть проверка структуры данных, журнал ошибок, корзина и способы восстановления. Если видите ошибку, перед исправлением сохраните JSON-копию.</div></details><details data-help-section><summary>⌨️ Клавиши и жесты</summary><div class="note">На экране повторения: Space — показать ответ или продолжить; 1 — «Снова»; 2 — «Трудно»; 3 — «Хорошо»; 4 — «Легко»; Enter — проверить или перейти дальше; U — отменить последний ответ; B — отложить до завтра; R — озвучить. На сенсорном экране горизонтальные свайпы по карточке повторения после проверки ответа оценивают карточку: влево — «Снова», сильнее влево — «Трудно», вправо — «Хорошо», сильнее вправо — «Легко». Свайп от левого края вправо возвращает из вложенного экрана, если есть шаг назад; на корневом экране он может открыть меню. Нижние шторки закрываются свайпом вниз при прокрутке к верху.</div></details><details data-help-section><summary> Ниже я дам транскрипцию, субтитры (.srt) или фрагмент текста. Выбери из них 30–40 самых полезных выражений и выдай готовый блок для импорта в моё приложение с карточками.

ЧТО ВЫБИРАТЬ (по приоритету): идиомы и устойчивые выражения; полезные конструкции и разговорные формы (gonna, gotta, "you were supposed to…"); фразовые глаголы; частотные слова и фразы для живой речи.
НЕ БРАТЬ: имена, редкие слова, шутки, непонятные без картинки, нецензурную лексику, слова песен (строки с ♪).

ФОРМАТ ВЫВОДА: только один блок кода, одна строка на фразу, без нумерации, заголовков и пояснений. Формат строки:
фраза | перевод | пример | тип | | сцена | теги

ПРАВИЛА ДЛЯ ПОЛЕЙ:
1. фраза: короткий устойчивый фрагмент (2–6 слов), строчными буквами, без точки.
2. перевод: естественный русский перевод по смыслу, 1–6 слов.
3. пример: короткое предложение (4–10 слов), содержит «фразу». Можно дать до трёх разных примеров, разделяя их « // ».
4. тип: идиома, конструкция, глагол, слово, фраза.
5. пятое поле пустое, разделители | сохрани.
6. сцена: источник и место («S1E2 12:40» или «Chapter 3 p.45»).
7. теги (необязательно): через пробел, без #.
8. Без дубликатов. Не используй символ | внутри полей.

В конце одной строкой напиши название источника.

<вставьте текст или .srt>`;mo.AIN=`# Инструкция для нейросети: приложение «Карточки»

## 1. Что это и для кого
Одностраничное веб-приложение для изучения языка по сериалам, фильмам, подкастам и текстам. Карточки повторяются по интервальной системе как в Anki. Пользователь русскоязычный. Данные хранятся в браузере (IndexedDB, запасной вариант localStorage). Есть резервные копии JSON, слияние копий, авто-бэкапы, корзина, диагностика и журнал ошибок.

## 2. Твоя задача
Из транскрипции, субтитров или текста выбрать полезные выражения и выдать блок для импорта (раздел 3). Также можно: перевести фразы, придумать примеры и мнемоники, разобрать трудные карточки, подготовить данные для импорта или правки.

## 3. Формат импорта (вкладка «Добавить»)
Одна строка = одна карточка, разделитель « | »:
фраза | перевод | пример | тип | мой пример | сцена
- Обязательны первые два поля. Название колоды вписывается отдельно: «Show S1E2» (папка = часть до S1E2) или «Папка :: серия».
- фраза: 2–6 слов, строчными, как звучит в источнике, без точки на конце.
- перевод: по-русски, по смыслу в контексте; для конструкций шаблон («тебе придётся + глагол»).
- пример: короткое предложение, которое дословно содержит «фразу» (иначе режим «Написать» не сделает пропуск).
- тип: идиома, конструкция, глагол, слово, фраза.
- мой пример: оставляй пустым (заполняет пользователь), но сохраняй разделитель.
- сцена: название серии и таймкод, например S1E2 12:40.
- Если в колоде уже есть карточка с такой фразой и переводом «⟨перевести⟩», новый перевод подставится в неё.
Вывод: один блок кода без нумерации, заголовков и пояснений; в конце строка с названием колоды.

## 4. Правила качества
- Приоритет: идиомы, конструкции, разговорные формы (gonna, gotta), фразовые глаголы, полезные слова уровня B1–B2.
- Не брать: имена, редкие слова, шутки, зависящие от картинки, нецензурную лексику, строки песен.
- 30–40 фраз на серию длиной около 22 минут; без дубликатов; уже имеющиеся фразы пропускать.
- Примеры пиши сам. Не воспроизводи реплики и тексты песен целиком: они защищены авторским правом.

## 5. Импорт из субтитров прямо в приложении
Вкладка «Добавить» → «Импорт из субтитров (.srt)». Файл разбирается на устройстве: убираются теги, звуки и строки песен, ищутся разговорные формы, фразовые глаголы, идиомы и повторяющиеся словосочетания. Пользователь отмечает кандидатов; карточки добавляются с переводом «⟨перевести⟩», таймкодом в поле «сцена» и (по желанию) репликой как примером. Кнопка «Скопировать для перевода» готовит текст для нейросети: нужно перевести поле «перевод» и вернуть те же строки.

## 6. Как устроено приложение
- Вкладки: Повтор, Колода, Правила, Перед (шпаргалка), Экзамен, Добавить, 📊 статистика, ⚙ настройки, ❓ справка.
- Раздел «Правила» предназначен для грамматики и языковых закономерностей, а не для словарных фраз. Создавай правило через отдельную форму: название, вопрос-подсказка, объяснение, формула, английские примеры с русским переводом, типичные ошибки, заметки, путь категории через « :: » и теги. Правила имеют собственную очередь повторения и отдельный шаблон вопроса/ответа; оценка идёт через общий интервальный планировщик. При создании карточки слова не подменяй ею правило.
- Режимы повторения: Узнать (EN→RU или RU→EN), Написать (прощает одну опечатку), Диктант, Собрать, Выбор, 🎲 Микс.
- Алгоритм как в Anki v2: шаги обучения 1 и 10 мин; интервал после обучения 1 день; «Легко» у новой 4 дня; лёгкость 250%; бонус «Легко» 130%; множитель «Трудно» 120%. Просрочка: «Трудно» (интервал + просрочка/4)·1,2; «Хорошо» (интервал + просрочка/2)·лёгкость; «Легко» (интервал + просрочка)·лёгкость·бонус. Лёгкость: «Снова» −20%, «Трудно» −15%, «Легко» +15%, минимум 130%. После ошибки карточка проходит переобучение (1 или 2 «Хорошо» в зависимости от настройки).
- Пиявки: после порога ошибок (по умолчанию 8) карточка откладывается, ведётся отдельный счётчик пиявок (lch), число ошибок сохраняется.
- Мягкий режим после перерыва: если пользователь не заходил N дней (по умолчанию 5) и просрочено больше лимита, показывается не больше M повторов в день (по умолчанию 40), сначала самые старые, новые карточки на паузе; режим выключается сам.
- Лимиты: новых и повторов в день, отдельный лимит новых для каждой колоды.
- Профили: набор карточек, теги и общие контекстные примеры общие; прогресс, настройки, «Мой пример», заметки, экзамены и достижения у каждого профиля свои.
- Работа с карточкой: фокус-режим скрывает статистику и вспомогательные кнопки (кнопка «⋯» раскрывает их); ответ и кнопки оценки появляются сразу после нажатия на карточку; «Мой пример» и «Заметка» свёрнуты и раскрываются по нажатию.
- Колоды и папки, смарт-колоды, массовые действия, поиск и слияние дубликатов, достижения, напоминание о перерыве, вибрация, отмена до 10 ответов, свайпы и горячие клавиши.
- Экзамен: без влияния на расписание; выбор одной или нескольких колод, число вопросов, типы заданий, таймер, показ ответа сразу. Разговорная практика: сценарии A2–B1, аудио реплики через системный TTS, ввод ответа и голосовое распознавание при поддержке браузера; самооценка не меняет интервалы.
- Надёжность: запрос постоянного хранилища; скачивание и загрузка JSON; слияние копий (новые карточки добавляются, берётся более свежий прогресс); авто-бэкапы в IndexedDB (3 последних); отмена последнего восстановления или сброса; корзина (30 дней) для удалённых карточек, колод и профилей; диагностика (поиск и починка битых данных); журнал ошибок; офлайн-режим через Service Worker (файл sw.js рядом с index.html).

## 7. Структура JSON резервной копии (схема 3)
{ cards: [{u, id, en, ru, ex, t, src, sc}], prof: {<id>: {name, prog: {<u>: {state, step, ease, ivl, due, reps, lapses, my, note, star, snz, tm, tn, susp, rstep, lch}}, log, ok, nn, rr, set, lim, sel, typ, starOnly, ex, xc, ach, cu, lo}}, pid, theme, trash, schema, seeded }
Поля: u — постоянный идентификатор карточки; id = «колода|фраза строчными»; state: 0 новая, 1 учится, 2 повтор, 3 заново; ivl в днях; ease: 2.5 = 250%; due — время в миллисекундах; lch — сколько раз карточка становилась пиявкой. Для карточек правил может дополнительно встречаться \`rule\` с версией payload \`schema: 1\`: prompt, explanation, formula, bilingual examples, mistakes, notes и categoryPath. Это вложенное поле не меняет envelope backup schema 3; сохраняй его при копировании/редактировании. Не меняй u и ключи prog без необходимости; после правки JSON должен остаться валидным.

## 9А. Работа с примерами (v13)
- В каждой карточке есть список примеров (поле exs) — можно хранить много разных контекстов.
- В карточке повтора кнопка 💡 открывает bottom-sheet со всеми примерами: добавить, редактировать, удалить, найти фразу в других колодах.
- Клик по примеру в колоде ротирует (переключает на следующий).
- Экспорт для ИИ: ⚙ → 💾 или Добавить → 🤖. Скопируй список фраз → попроси ИИ дать примеры → вставь обратно через «Импорт ответа ИИ».
- Формат ответа ИИ: одна строка = один пример, разделитель «|», «фраза | пример».

## 9. Синтаксис расширенного поиска (v12)
- Текст: любое слово.
- тип:идиома / тип:глагол.
- колода:Charlie.
- state:new / state:learn / state:review / state:leech / state:star / state:mature.
- due:today / due:overdue / due:week.
- lapses>N, ease<N.
- Префикс минус исключает: -колода:Charlie, -state:leech.
- Комбинируется: state:leech -колода:Charlie.

## 11. Дополнения v14
- Несколько примеров в строке импорта: через « // » в третьем поле. Седьмое поле — теги (через пробел или запятую, # не нужен): «фраза | перевод | ex1 // ex2 | тип | мой пример | сцена | теги».
- Импорт CSV/TSV/Anki: вкладка «Добавить» → «Импорт CSV / TSV / Anki». TSV без заголовка читается как «лицо, оборот, теги» (формат экспорта Anki), CSV без заголовка как «фраза, перевод, пример, тип, теги». HTML и <br> на обороте разбираются на перевод и примеры.
- Поиск в «Колоде» (условия через пробел = «и»): lapses>2, ivl<=7, ease<2.2, reps>=3, time>5 (секунд), state:new|learn|rev|relearn (новая|учится|повтор|заново), due:today|tomorrow|overdue|week (сегодня|завтра|просрочено|неделя), тип:идиома, колода:Show, #тег или тег:еда, has:note|my|ex|sc|tags, ★, susp; минус исключает: -тип:слово; «фраза в кавычках». Работает и с кириллицей. Поиск можно сохранить кнопкой 💾.
- Режим «Скажи» (распознавание речи, если поддерживает браузер) и запись своего голоса на обороте карточки (хранится в IndexedDB и не входит в JSON-копию).
- Настройки: разброс интервалов fuzz (детерминированный: подпись на кнопке совпадает с результатом), максимальный интервал, режим «только карточка», размер интерфейса, время напоминания (файл .ics), «Поделиться копией», самопроверка расчётов.
- Статистика: удержание отдельно для молодых (до 21 дня) и зрелых карточек, распределение времени ответа.
- В JSON добавились: cards[].tags, cards[].exs/exCur, prof[].rt (удержание), rec (карточки с записью), saved (сохранённые поиски), trash[].progs (прогресс всех профилей для удалённых карточек).
