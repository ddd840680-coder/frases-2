<style>

@media (min-width:820px){.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}.sidenav{display:flex}.bottomnav{display:none}.main{padding:0 32px 40px}.drw-btn{display:none}}

.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:86vw;background:var(--card);z-index:11;transform:translateX(-100%);transition:transform .24s cubic-bezier(.34,1.1,.64,1);box-shadow:var(--shadow-lg);padding:20px 12px;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}

.overlay.open{opacity:1;pointer-events:auto}

.hdr{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}

.ring-wrap{width:56px;height:56px;position:relative;flex-shrink:0}

.content{padding-bottom:8px}
.row{display:flex;gap:10px;margin-top:14px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}

.btn,.chip,.tab{border:0;font:inherit;cursor:pointer;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .16s ease-out,background .15s,box-shadow .15s,color .15s}

input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid transparent;border-radius:var(--r-sm);padding:11px 14px;margin-top:6px;transition:border .15s,background .15s}

.item{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm)}
.item small{color:var(--mute)}
.lv{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--line);color:var(--ink2);white-space:nowrap;align-self:flex-start;font-weight:600}

details[open] > summary{padding-bottom:10px}details > details{padding:0 12px;background:var(--bg2);box-shadow:none;border-color:transparent;margin:6px 0}

/* v15.4 usability polish */
input[type="search"],#fl,#howSearch{width:100%;min-height:54px;padding:14px 16px;font-size:16px;border-radius:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);}

.search-help-trigger{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;margin:8px 0 14px;padding:10px 14px;border:1px dashed var(--line2);border-radius:13px;background:var(--bg2);color:var(--ink2);font-family:inherit;font-size:13px;font-weight:600;line-height:1.3;cursor:pointer;}
.search-help-sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .16s ease-out;}
.search-help-scrim{position:absolute;inset:0;background:rgba(15,22,40,.42);backdrop-filter:blur(3px);}
.search-help-panel{position:relative;width:min(100%,560px);max-height:min(82dvh,780px);overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:sheetUp .24s cubic-bezier(.22,1,.36,1);}
.sheet-grabber{width:38px;height:4px;border-radius:8px;background:var(--line2);margin:2px auto 14px;}
.search-help-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.search-help-head h3{font-size:22px;line-height:1.2;margin:4px 0 0;letter-spacing:-.025em;}
.search-help-panel>p{font-size:13px;color:var(--mute);margin:10px 0 14px;}
.search-example-group{display:grid;gap:6px;margin-bottom:14px;}
.search-example-group>b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-top:8px;}
.search-example{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;text-align:left;align-items:center;min-height:56px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;}
.search-example span{font-weight:700;font-size:14px;grid-column:1;}
.search-example small{font-size:12px;color:var(--mute);grid-column:1;}
.search-example i{grid-column:2;grid-row:1/3;font-style:normal;color:var(--acc);font-size:24px;}
.manual-card-details,.bulk-add-details{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);}
.manual-card-details>summary,.bulk-add-details>summary{padding:15px 16px;min-height:56px;background:var(--bg2);}
.manual-card-details[open]>summary,.bulk-add-details[open]>summary{border-bottom:1px solid var(--line);}
.manual-card-form{padding:14px;}
#manualSrc,#manualEn,#manualRu,#manualEx,#manualMy,#manualTags,#tx,#howSearch{width:100%;min-height:52px;font-size:16px;padding:13px 14px;border-radius:13px;}
#manualEx,#manualMy,#tx{min-height:100px;resize:vertical;}
#manualTags{padding-right:44px;}
.manual-card-form .btn{min-height:48px;}
.manual-tag-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.manual-tag-suggestions .chip{min-height:34px;padding:6px 10px;font-size:12px;}
.settings-save-dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:8;margin:18px -2px 6px;padding:12px;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);backdrop-filter:blur(12px);}
.settings-save-dock .note{margin:0 0 6px;}
.settings-save-dock .row{margin:0;}
.progress-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px;margin-bottom:14px;border-radius:24px;background:linear-gradient(130deg,var(--acc-tint),var(--card) 72%);border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;}
.progress-hero-copy{max-width:560px;}
.progress-hero h2{font-size:clamp(24px,4vw,32px);line-height:1.08;letter-spacing:-.04em;margin:6px 0 9px;}
.progress-hero p{font-size:13px;line-height:1.55;color:var(--mute);margin:0;max-width:430px;}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--acc);}
.progress-orbit{position:relative;flex:none;width:112px;height:112px;display:grid;place-content:center;text-align:center;}
.progress-orbit svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--line2);stroke-width:6;transform:rotate(-90deg);}
.progress-orbit .orbit-value{stroke:var(--acc);stroke-linecap:round;transition:stroke-dasharray .7s ease;animation:orbitIn .9s ease-out both;}
.progress-orbit path{fill:var(--ach);stroke:none;transform:rotate(90deg);transform-origin:60px 60px;}
.progress-orbit b{font-size:26px;line-height:1.05;z-index:1;}
.progress-orbit small{font-size:10px;color:var(--mute);z-index:1;}
@keyframes orbitIn{from{stroke-dasharray:0 295}to{}}
.progress-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.progress-kpi{min-width:0;padding:15px;border-radius:17px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-sm);}
.progress-kpi span,.progress-kpi small{display:block;color:var(--mute);font-size:11px;}
.progress-kpi b{display:block;font-size:clamp(22px,3vw,30px);line-height:1.15;letter-spacing:-.04em;margin:8px 0 5px;}
.progress-section{margin-top:10px;overflow:hidden;}
.progress-section>summary{padding:16px 18px;font-weight:750;}
.progress-chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px 0;}

var AIP="Ты — помощник для изучения иностранного языка по аутентичным материалам (сериалы, фильмы, подкасты, книги, статьи). Я русскоязычный ученик (уровень B1–B2).\nНиже я дам транскрипцию, субтитры (.srt) или фрагмент текста. Выбери из них 30–40 самых полезных выражений и выдай готовый блок для импорта в моё приложение с карточками.\n\nЧТО ВЫБИРАТЬ (по приоритету): идиомы и устойчивые выражения; полезные конструкции и разговорные формы (gonna, gotta, \"you were supposed to…\"); фразовые глаголы; частотные слова и фразы для живой речи.\nНЕ БРАТЬ: имена, редкие слова, шутки, непонятные без картинки, нецензурную лексику, слова песен (строки с ♪).\n\nФОРМАТ ВЫВОДА: только один блок кода, одна строка на фразу, без нумерации, заголовков и пояснений. Формат строки:\nфраза | перевод | пример | тип | | сцена | теги\n\nПРАВИЛА ДЛЯ ПОЛЕЙ:\n1. фраза: короткий устойчивый фрагмент (2–6 слов), строчными буквами, без точки.\n2. перевод: естественный русский перевод по смыслу, 1–6 слов.\n3. пример: короткое предложение (4–10 слов), содержит «фразу». Можно дать до трёх разных примеров, разделяя их « // ».\n4. тип: идиома, конструкция, глагол, слово, фраза.\n5. пятое поле пустое, разделители | сохрани.\n6. сцена: источник и место («S1E2 12:40» или «Chapter 3 p.45»).\n7. теги (необязательно): через пробел, без #.\n8. Без дубликатов. Не используй символ | внутри полей.\n\nВ конце одной строкой напиши название источника.\n\nМатериал:\n<вставьте текст или .srt>",AIN="# Инструкция для нейросети: приложение «Карточки»\n\n## 1. Что это и для кого\nОдностраничное веб-приложение для изучения языка по сериалам, фильмам, подкастам и текстам. Карточки повторяются по интервальной системе как в Anki. Пользователь русскоязычный. Данные хранятся в браузере (IndexedDB, запасной вариант localStorage). Есть резервные копии JSON, слияние копий, авто-бэкапы, корзина, диагностика и журнал ошибок.\n\n## 2. Твоя задача\nИз транскрипции, субтитров или текста выбрать полезные выражения и выдать блок для импорта (раздел 3). Также можно: перевести фразы, придумать примеры и мнемоники, разобрать трудные карточки, подготовить данные для импорта или правки.\n\n## 3. Формат импорта (вкладка «Добавить»)\nОдна строка = одна карточка, разделитель « | »:\nфраза | перевод | пример | тип | мой пример | сцена\n- Обязательны первые два поля. Название колоды вписывается отдельно: «Show S1E2» (папка = часть до S1E2) или «Папка :: серия».\n- фраза: 2–6 слов, строчными, как звучит в источнике, без точки на конце.\n- перевод: по-русски, по смыслу в контексте; для конструкций шаблон («тебе придётся + глагол»).\n- пример: короткое предложение, которое дословно содержит «фразу» (иначе режим «Написать» не сделает пропуск).\n- тип: идиома, конструкция, глагол, слово, фраза.\n- мой пример: оставляй пустым (заполняет пользователь), но сохраняй разделитель.\n- сцена: название серии и таймкод, например S1E2 12:40.\n- Если в колоде уже есть карточка с такой фразой и переводом «⟨перевести⟩», новый перевод подставится в неё.\nВывод: один блок кода без нумерации, заголовков и пояснений; в конце строка с названием колоды.\n\n## 4. Правила качества\n- Приоритет: идиомы, конструкции, разговорные формы (gonna, gotta), фразовые глаголы, полезные слова уровня B1–B2.\n- Не брать: имена, редкие слова, шутки, зависящие от картинки, нецензурную лексику, строки песен.\n- 30–40 фраз на серию длиной около 22 минут; без дубликатов; уже имеющиеся фразы пропускать.\n- Примеры пиши сам. Не воспроизводи реплики и тексты песен целиком: они защищены авторским правом.\n\n## 5. Импорт из субтитров прямо в приложении\nВкладка «Добавить» → «Импорт из субтитров (.srt)». Файл разбирается на устройстве: убираются теги, звуки и строки песен, ищутся разговорные формы, фразовые глаголы, идиомы и повторяющиеся словосочетания. Пользователь отмечает кандидатов; карточки добавляются с переводом «⟨перевести⟩», таймкодом в поле «сцена» и (по желанию) репликой как примером. Кнопка «Скопировать для перевода» готовит текст для нейросети: нужно перевести поле «перевод» и вернуть те же строки.\n\n## 6. Как устроено приложение\n- Вкладки: Повтор, Колода, Перед (шпаргалка), Экзамен, Добавить, 📊 статистика, ⚙ настройки, ❓ справка.\n- Режимы повторения: Узнать (EN→RU или RU→EN), Написать (прощает одну опечатку), Диктант, Собрать, Выбор, 🎲 Микс.\n- Алгоритм как в Anki v2: шаги обучения 1 и 10 мин; интервал после обучения 1 день; «Легко» у новой 4 дня; лёгкость 250%; бонус «Легко» 130%; множитель «Трудно» 120%. Просрочка: «Трудно» (интервал + просрочка/4)·1,2; «Хорошо» (интервал + просрочка/2)·лёгкость; «Легко» (интервал + просрочка)·лёгкость·бонус. Лёгкость: «Снова» −20%, «Трудно» −15%, «Легко» +15%, минимум 130%. После ошибки карточка проходит переобучение (1 или 2 «Хорошо» в зависимости от настройки).\n- Пиявки: после порога ошибок (по умолчанию 8) карточка откладывается, ведётся отдельный счётчик пиявок (lch), число ошибок сохраняется.\n- Мягкий режим после перерыва: если пользователь не заходил N дней (по умолчанию 5) и просрочено больше лимита, показывается не больше M повторов в день (по умолчанию 40), сначала самые старые, новые карточки на паузе; режим выключается сам.\n- Лимиты: новых и повторов в день, отдельный лимит новых для каждой колоды.\n- Профили: набор карточек, теги и общие контекстные примеры общие; прогресс, настройки, «Мой пример», заметки, экзамены и достижения у каждого профиля свои.\n- Работа с карточкой: фокус-режим скрывает статистику и вспомогательные кнопки (кнопка «⋯» раскрывает их); ответ и кнопки оценки появляются сразу после нажатия на карточку; «Мой пример» и «Заметка» свёрнуты и раскрываются по нажатию.\n- Колоды и папки, смарт-колоды, массовые действия, поиск и слияние дубликатов, достижения, напоминание о перерыве, вибрация, отмена до 10 ответов, свайпы и горячие клавиши.\n- Экзамен: без влияния на расписание; выбор одной или нескольких колод, число вопросов, типы заданий, таймер, показ ответа сразу. Разговорная практика: сценарии A2–B1, аудио реплики через системный TTS, ввод ответа и голосовое распознавание при поддержке браузера; самооценка не меняет интервалы.\n- Надёжность: запрос постоянного хранилища; скачивание и загрузка JSON; слияние копий (новые карточки добавляются, берётся более свежий прогресс); авто-бэкапы в IndexedDB (3 последних); отмена последнего восстановления или сброса; корзина (30 дней) для удалённых карточек, колод и профилей; диагностика (поиск и починка битых данных); журнал ошибок; офлайн-режим через Service Worker (файл sw.js рядом с index.html).\n\n## 7. Структура JSON резервной копии (схема 3)\n{ cards: [{u, id, en, ru, ex, t, src, sc}], prof: {<id>: {name, prog: {<u>: {state, step, ease, ivl, due, reps, lapses, my, note, star, snz, tm, tn, susp, rstep, lch}}, log, ok, nn, rr, set, lim, sel, typ, starOnly, ex, xc, ach, cu, lo}}, pid, theme, trash, schema, seeded }\nПоля: u — постоянный идентификатор карточки; id = «колода|фраза строчными»; state: 0 новая, 1 учится, 2 повтор, 3 заново; ivl в днях; ease: 2.5 = 250%; due — время в миллисекундах; lch — сколько раз карточка становилась пиявкой. Не меняй u и ключи prog без необходимости; после правки JSON должен остаться валидным.\n\n## 8. Шаблон промпта для извлечения фраз из транскрипции\n(пользователь вставляет его в чат вместе с субтитрами; тот же текст лежит в приложении на вкладке «Добавить»)\n\n"+AIP;

function libraryPathParts(src){

}
function libraryPathPrefix(parts,path){if(parts.length<path.length)return false;for(var i=0;i<path.length;i++)if(parts[i]!==path[i])return false;return true}

function libraryChildrenCount(path,srcs){var seen={};srcs.forEach(function(src){var pp=libraryPathParts(src);if(libraryPathPrefix(pp,path)&&pp.length>path.length)seen[pp[path.length]]=1});return Object.keys(seen).length}
function libraryChildren(path,srcs,now,end){

 srcs.forEach(function(src){var pp=libraryPathParts(src);if(!libraryPathPrefix(pp,path)||pp.length<=path.length)return;var name=pp[path.length];if(!nodes[name])nodes[name]={name:name,hasChildren:false,sources:[]};if(pp.length===path.length+1)nodes[name].sources.push(src);else nodes[name].hasChildren=true});
 Object.keys(nodes).sort(function(a,b){return a.localeCompare(b,'ru')}).forEach(function(name){var n=nodes[name],child=path.concat([name]);if(n.hasChildren){html+=libraryFolderTile(name,child,srcs,true)}else{n.sources.forEach(function(src){html+=libraryCollectionTile(src)})}});

 h+='<details class="progress-section"><summary>🔮 Прогноз нагрузки на 7 дней</summary><div class="progress-bars forecast-bars">'+fc.map(function(v,i){return'<div class="progress-bar" title="'+new Date(addD(now,i)).toLocaleDateString()+': '+v+' карточек"><i style="height:'+Math.max(v?4:2,Math.round(v/mf*94))+'px;--bar-delay:'+(i*45)+'ms;background:var(--ok)"></i><span>'+['Сег','Вт','Ср','Чт','Пт','Сб','Вс'][new Date(addD(now,i)).getDay()===0?6:new Date(addD(now,i)).getDay()-1]+' '+new Date(addD(now,i)).getDate()+'</span></div>'}).join('')+'</div><div class="note">Прогноз помогает распределить нагрузку. Реальный объём может меняться после ответов и добавления карточек.</div>'+renderForecast()+'</details>';

 var hl=hardList().slice(0,10);h+='<details class="progress-section"><summary>🔥 Трудные карточки · '+hl.length+'</summary>'+(hl.length?hl.map(function(c){return'<div class="item" style="box-shadow:none;background:var(--bg2)"><div><b>'+esc(c.en)+'</b><br><small>'+esc(c.ru)+'</small></div><span class="lv">'+c.lapses+'</span></div>'}).join('')+'<div class="row"><button type="button" class="btn" data-a="dr">🔥 Тренировать трудные</button></div>':'<div class="note">Пока нет карточек, которые часто вызывают ошибки.</div>')+'</details>';
 var lc=S.cards.filter(function(c){return c.susp});h+='<details class="progress-section"><summary>🩸 Карточки, требующие внимания · '+lc.length+'</summary>'+(lc.length?lc.map(function(c){return'<div class="item" style="box-shadow:none;background:var(--bg2)"><div style="flex:1;min-width:0"><b>'+esc(c.en)+'</b><br><small>'+esc(c.ru)+'</small></div><button type="button" class="chip" data-a="us" data-v="'+esc(c.u)+'">↺ Вернуть</button></div>'}).join(''):'<div class="note">Нет приостановленных карточек.</div>')+'</details>';
 return h
}
function how(){
 return '<div class="help-start"><h2>Справка по приложению</h2><p>Короткий маршрут: добавьте фразы в библиотеку, повторяйте их ежедневно, а в разделе «Практика» проверяйте навыки без изменения расписания. Подробности по темам ниже — поиск работает по содержимому справки.</p><div class="help-shortcuts"><button type="button" data-a="t" data-v="all">📚 Открыть библиотеку</button><button type="button" data-a="addManual">＋ Создать карточку</button><button type="button" data-a="t" data-v="rev">🎯 Начать повторение</button><button type="button" data-a="t" data-v="ex">🎓 Открыть практику</button></div></div>'+
 '<div class="fld help-search"><label for="howSearch">Найти тему в справке</label><input type="search" id="howSearch" placeholder="Найдите тему: теги, импорт, FSRS…" autocomplete="off" enterkeyhint="search" aria-label="Поиск по справке"></div><div id="helpSearchStatus" class="note" style="margin-top:0">Введите ключевое слово; ненужные темы скроются.</div>'+
 '<details data-help-section><summary>🧭 Навигация и свайпы</summary><div class="note"><b>Библиотека</b> объединяет просмотр всех слов и добавление новых карточек. Нажмите «＋ Добавить» — откроется форма создания. Форму одной карточки и массовый импорт можно независимо сворачивать. Кнопка «Назад в библиотеку» возвращает к списку. В экране вложенного раздела проведите пальцем от левого края вправо, чтобы вернуться назад, если для текущего экрана есть предыдущий шаг. Для нижней шторки используйте вертикальный свайп вниз или кнопку ×. Нажатие на затемнение закрывает шторку; Esc закрывает её на клавиатуре. Если экран не вложенный, свайп от края может открывать меню навигации.</div></details>'+
 '<details data-help-section><summary>📚 Библиотека: поиск и фильтры</summary><div class="note"><b>Обычный поиск</b> ищет английскую фразу, русский перевод, примеры, заметки, тип, коллекцию и теги. Введите часть фразы, например <code>appointment</code>, или русский смысл. В запросах с несколькими условиями каждое условие должно совпасть. Поиск выполняется по всей библиотеке: при вводе запроса приложение возвращает из папок к общим результатам, чтобы ничего не скрыть. Примеры синтаксиса открываются нижней шторкой по нажатию на поле поиска или кнопку «Примеры поиска и фильтров». Кавычки ищут фразу целиком, например <code>"hang in there"</code>. Тег можно искать через <code>#work</code> или <code>тег:work</code>.<br><br><b>Быстрые фильтры</b> открываются кнопкой «Фильтры». В них можно выбрать коллекцию, статус, срок повторения, тип фразы и тег, а затем нажать «Применить фильтры». Они только скрывают неподходящие карточки, не меняя саму колоду и расписание. «Сбросить» возвращает все значения.<br><br><b>Примеры поисковых условий:</b><br><code>state:new</code> — новые карточки; <code>state:learn</code> — в обучении; <code>state:rev</code> — на повторении; <code>state:relearn</code> — переобучение; <code>due:overdue</code> — просроченные; <code>due:today</code> — срок сегодня; <code>due:week</code> — срок в ближайшую неделю; <code>колода:Charlie</code> — коллекция по названию; <code>тип:идиома</code>; <code>lapses&gt;2</code> — больше двух ошибок; <code>ivl&lt;=7</code> — интервал не больше недели; <code>has:ex</code> — есть примеры; <code>has:note</code> — есть заметка; <code>★</code> — избранное; <code>susp</code> — приостановленные карточки. Перед условием можно поставить минус, чтобы исключить результат, например <code>-тип:слово</code>. Кнопка «Сохранить поиск» сохраняет текстовый запрос.</div></details>'+
 '<details data-help-section><summary>🗂 Коллекции, папки и подколлекции</summary><div class="note">У каждой карточки есть коллекция — это имя, по которому сгруппированы слова. Для собственных фраз можно использовать «Мои карточки». Внутри раздела есть действия «Добавить в этот раздел» и «Новый подраздел», а в форме создания карточки коллекцию можно выбрать из списка или ввести самостоятельно. Чтобы организовать вложенность, задайте имя в формате <code>Мои карточки :: Работа</code>, <code>Английский :: Путешествия</code> или <code>Английский :: Работа :: Встречи</code>. Часть до разделителя <code>::</code> используется как родительская папка; полный путь остаётся названием коллекции. Новая коллекция или подраздел появляется после сохранения первой карточки. В библиотеке нажимайте на прямоугольник папки, чтобы войти внутрь, и на прямоугольник коллекции, чтобы открыть её карточки. Кнопка «Назад» возвращает на уровень выше; на телефоне также работает свайп от левого края вправо. Внутри раздела можно добавить карточку прямо в него или создать вложенный подраздел. Название коллекции можно изменить через действие «Переименовать» в раскрытой коллекции; отдельную карточку — через кнопку с карандашом. Папки являются путями группировки: перед массовым изменением их имён сначала проверьте, какие коллекции в них входят.</div></details>'+
 '<details data-help-section><summary>✍️ Создание одной карточки вручную</summary><div class="note">Откройте «Библиотека» → «＋ Добавить». В поле «Раздел / коллекция» оставьте «Мои карточки» или задайте свой путь. Введите английскую фразу и её естественный перевод — это обязательные поля. Пример лучше делать коротким и естественным, чтобы он показывал употребление фразы. Тип помогает группировать материал: слово, фраза, глагол/фразовый глагол, идиома или конструкция. Теги вводятся через пробел или запятую, например <code>работа, B1, разговор</code>. При вводе можно выбрать существующий тег из подсказок или нажать на тег-плашку под полем. «Мой пример» — предложение, которое вы составили сами; оно отличается от общего примера карточки. Нажмите «Сохранить карточку». После сохранения поля фразы и перевода очищаются, а коллекция остаётся прежней, чтобы можно было быстро добавить следующее выражение.<br><br>Для массового добавления раскройте «Добавить сразу много карточек». Каждая строка имеет формат <code>фраза | перевод | пример | тип | мой пример | сцена | теги</code>; обязательны первые два поля. Для самостоятельных карточек не обязательно указывать сцену.</div></details>'+
 '<details data-help-section><summary>📄 Субтитры, CSV и готовые списки</summary><div class="note">В форме добавления откройте блок «Добавить сразу много карточек». Импорт субтитров принимает SRT или текстовый файл, выделяет кандидатов-фраз и сохраняет таймкоды. Это автоматический подбор кандидатов, а не гарантированно идеальный анализ речи; просмотрите список и отметьте нужные выражения. «Скопировать для перевода» позволяет подготовить выбранные строки для внешнего переводчика или нейросети. CSV/TSV удобно использовать для готовых таблиц; проверьте сопоставление столбцов перед добавлением. Дубли с теми же фразой и коллекцией не должны случайно плодиться; если импортируете материал повторно, сначала проверьте список и повторяющиеся фразы.</div></details>'+
 '<details data-help-section><summary>🎯 Повторение и режимы карточек</summary><div class="note">Вкладка «Учиться» показывает карточки, которым пришло время повторения, с учётом лимитов и выбранных коллекций. В режиме «Узнать» сначала попробуйте вспомнить перевод; можно нажать на карточку, чтобы раскрыть ответ, или сразу оценить, если ответ уже знаете. «Снова» выбирайте, если не вспомнили; «Трудно» — если вспомнили, но с большим усилием; «Хорошо» — обычный уверенный ответ; «Легко» — мгновенное воспоминание без усилий. Не выбирайте «Легко» только потому, что ответ кажется знакомым: ориентируйтесь на реальное воспоминание.<br><br>Другие режимы: «Написать» — вспомнить английскую фразу по русскому смыслу; «Диктант» — прослушать и написать; «Собрать» — составить английскую фразу из слов; «Выбор» — выбрать вариант; «Скажи» — ответить голосом при поддержке браузера; «Микс» объединяет выбранные режимы. При оценке карточки расписание обновляется по выбранному алгоритму. Экзамен и разговорная практика отдельно не меняют расписание.</div></details>'+
 '<details data-help-section><summary>🧠 SM-2 и FSRS — расписание повторений</summary><div class="note">SM-2 оставлен для совместимости с прежним расписанием. Он рассчитывает следующий интервал на основе оценки, текущего интервала и коэффициента лёгкости. FSRS-6 — модель повторений, использующая оценку стабильности и сложности памяти; у него есть параметр желаемого удержания. Более высокое удержание обычно означает более частые повторы. При переключении алгоритма приложение не должно массово переносить все даты автоматически. Для старых карточек, у которых нет истории FSRS, начальное состояние оценивается приблизительно. Персональная оптимизация параметров по истории занятий не включена, поэтому не считайте текущие параметры индивидуально обученными под вас. Делайте резервную копию перед крупной настройкой.</div></details>'+
 '<details data-help-section><summary>🎓 Практика: экзамен и разговор</summary><div class="note">Раздел «Практика» начинается с двух отдельных карточек. <b>Экзамен по карточкам</b> использует слова из выбранных коллекций; можно настроить количество вопросов, тип заданий, таймер и показ правильного ответа. Результат сохраняется в истории экзаменов, но не меняет расписание повторений. <b>Разговорная практика</b> — сценарии уровня A2–B1: прослушайте реплику собеседника, попробуйте понять её без текста, ответьте по-английски устно или письменно, затем откройте образец и полезные конструкции. Самооценка сохраняет ощущение результата, но не является объективным тестом произношения или уровня. Озвучка использует системный синтез речи; качество голосов зависит от устройства. Голосовой ввод поддерживается не всеми браузерами и может требовать интернета и разрешения микрофона.</div></details>'+
 '<details data-help-section><summary>📖 Обзор и примеры</summary><div class="note">«Обзор» — режим чтения колоды: можно просматривать фразы, скрывать или показывать перевод, озвучивать список и отмечать избранное. Он подходит для предварительного знакомства с материалом и не должен заменять активное вспоминание при повторении. В карточке могут быть общий пример, несколько контекстных примеров, ваш собственный пример и заметка. Кнопка примеров открывает список, где их можно редактировать или добавлять. Старайтесь использовать разные и короткие контексты, а не запоминать только единственный перевод.</div></details>'+
 '<details data-help-section><summary>📈 Статистика и нагрузка</summary><div class="note">Прогресс показывает число повторений, успешность ответов, календарь активности и прогнозируемую очередь. Новые карточки и повторения — разная работа: добавление большого числа слов само по себе не означает, что они уже запомнены. Если ежедневно не успеваете справляться с повторениями, временно уменьшите лимит новых карточек. Регулярные короткие сессии полезнее редких марафонов. Показатели самооценки разговорной практики не объединяются с успешностью карточек.</div></details>'+
 '<details data-help-section><summary>💾 Резервные копии и восстановление</summary><div class="note">Данные хранятся локально в браузере; это не автоматически синхронизируемое облако. Регулярно скачивайте JSON-копию в «Настройки» → «Данные». Функция «Объединить файл» добавляет новые карточки и выбирает более свежий прогресс; восстановление с заменой перезаписывает текущие данные, поэтому перед ним обязательно сделайте отдельную копию. В приложении доступны авто-бэкапы и отмена некоторых операций — их возможности зависят от сохранности хранилища браузера. Не удаляйте данные сайта и IndexedDB, если хотите сохранить прогресс. Профили позволяют отделять настройки и учебную историю, но не заменяют резервную копию.</div></details>'+
 '<details data-help-section><summary>📴 Работа офлайн и установка</summary><div class="note">Для устойчивой офлайн-работы откройте приложение на поддерживаемом HTTPS-хостинге и дождитесь активации Service Worker, затем запустите его ещё раз при наличии сети. Сам HTML-файл, открытый как <code>file://</code>, не может регистрировать Service Worker в обычном режиме, хотя отдельные функции могут работать локально. Повторение карточек и сохранённые данные доступны без сети после корректной установки и кэширования. Голосовой ввод, загрузка внешних материалов и некоторые возможности браузера могут требовать подключения. После обновления заменяйте и <code>index.html</code>, и <code>sw.js</code>, перезапускайте установленное приложение и не очищайте данные сайта.</div></details>'+
 '<details data-help-section><summary>⚙️ Настройки, профили и защита данных</summary><div class="note">В настройках выбирается SM-2 или FSRS-6, желаемое удержание, лимиты новых и повторов, шаги обучения, режим оформления, озвучка, вибрация, авто-бэкап и мягкий режим после перерыва. Меняйте настройки алгоритма осознанно: они влияют на расписание будущих оценок. Профили позволяют отдельно хранить настройки и учебный прогресс разных пользователей на этом устройстве; коллекции карточек в общем наборе могут использоваться несколькими профилями. В разделе надёжности есть проверка структуры данных, журнал ошибок, корзина и способы восстановления. Если видите ошибку, перед исправлением сохраните JSON-копию.</div></details>'+
 '<details data-help-section><summary>⌨️ Клавиши и жесты</summary><div class="note">На экране повторения: Space — показать ответ или продолжить; 1 — «Снова»; 2 — «Трудно»; 3 — «Хорошо»; 4 — «Легко»; Enter — проверить или перейти дальше; U — отменить последний ответ; B — отложить до завтра; R — озвучить. На сенсорном экране горизонтальные свайпы по карточке повторения после проверки ответа оценивают карточку: влево — «Снова», сильнее влево — «Трудно», вправо — «Хорошо», сильнее вправо — «Легко». Свайп от левого края вправо возвращает из вложенного экрана, если есть шаг назад; на корневом экране он может открыть меню. Нижние шторки закрываются свайпом вниз при прокрутке к верху.</div></details>'+
 '<details data-help-section><summary>🛠️ Что делать, если что-то не работает</summary><div class="note">Если карточки перестали отображаться, сначала попробуйте перезапустить приложение. При проблеме с офлайном проверьте, что одновременно обновлены <code>index.html</code> и <code>sw.js</code>, затем закройте и снова откройте PWA. При ошибке импорта проверьте обязательные поля «фраза» и «перевод», кодировку файла и разделитель столбцов. Если приложение сообщает о повреждении данных, не сбрасывайте прогресс: скачайте копию, откройте «Настройки» → «Диагностика», запустите проверку и сохраните журнал ошибок. Не сообщайте третьим лицам содержимое бэкапа без необходимости — он может включать всю коллекцию и прогресс.</div></details>'+
 '<details data-help-section><summary>🤖 Подготовка материала с помощью нейросети</summary><div class="note">Промпт в форме добавления просит извлекать полезные, естественные фразы без дубликатов и возвращать их в текстовом формате для импорта. Проверяйте перевод и пример: автоматически сгенерированный результат может быть неточным. Для каждой карточки желательно сохранять короткое значение по смыслу, пример, который содержит изучаемую фразу, тип, теги и контекст. Не включайте длинные защищённые авторским правом отрывки в карточки; храните только короткие выражения и собственные примеры.</div></details>'

AIN+="\n\n## 9А. Работа с примерами (v13)\n- В каждой карточке есть список примеров (поле exs) — можно хранить много разных контекстов.\n- В карточке повтора кнопка 💡 открывает bottom-sheet со всеми примерами: добавить, редактировать, удалить, найти фразу в других колодах.\n- Клик по примеру в колоде ротирует (переключает на следующий).\n- Экспорт для ИИ: ⚙ → 💾 или Добавить → 🤖. Скопируй список фраз → попроси ИИ дать примеры → вставь обратно через «Импорт ответа ИИ».\n- Формат ответа ИИ: одна строка = один пример, разделитель «|», «фраза | пример».\n\n## 9. Синтаксис расширенного поиска (v12)\n- Текст: любое слово.\n- тип:идиома / тип:глагол.\n- колода:Charlie.\n- state:new / state:learn / state:review / state:leech / state:star / state:mature.\n- due:today / due:overdue / due:week.\n- lapses>N, ease<N.\n- Префикс минус исключает: -колода:Charlie, -state:leech.\n- Комбинируется: state:leech -колода:Charlie.\n\n## 10. Что нового в v12\n- Плашка Доступна новая версия.\n- Озвучка списка на вкладке Перед.\n- Расширенные фильтры (раздел 9).\n- Скрытые разделы настроек и справки по умолчанию (настройка Раскрывать разделы).\n- Исправлен алгоритм переобучения.\n- Каскадная очистка прогресса при удалении карточек.\n- Anki-экспорт без HTML-escape.\n- Удалён устаревший код.\n";
AIN+="\n\n## 11. Дополнения v14\n- Несколько примеров в строке импорта: через « // » в третьем поле. Седьмое поле — теги (через пробел или запятую, # не нужен): «фраза | перевод | ex1 // ex2 | тип | мой пример | сцена | теги».\n- Импорт CSV/TSV/Anki: вкладка «Добавить» → «Импорт CSV / TSV / Anki». TSV без заголовка читается как «лицо, оборот, теги» (формат экспорта Anki), CSV без заголовка как «фраза, перевод, пример, тип, теги». HTML и <br> на обороте разбираются на перевод и примеры.\n- Поиск в «Колоде» (условия через пробел = «и»): lapses>2, ivl<=7, ease<2.2, reps>=3, time>5 (секунд), state:new|learn|rev|relearn (новая|учится|повтор|заново), due:today|tomorrow|overdue|week (сегодня|завтра|просрочено|неделя), тип:идиома, колода:Show, #тег или тег:еда, has:note|my|ex|sc|tags, ★, susp; минус исключает: -тип:слово; «фраза в кавычках». Работает и с кириллицей. Поиск можно сохранить кнопкой 💾.\n- Режим «Скажи» (распознавание речи, если поддерживает браузер) и запись своего голоса на обороте карточки (хранится в IndexedDB и не входит в JSON-копию).\n- Настройки: разброс интервалов fuzz (детерминированный: подпись на кнопке совпадает с результатом), максимальный интервал, режим «только карточка», размер интерфейса, время напоминания (файл .ics), «Поделиться копией», самопроверка расчётов.\n- Статистика: удержание отдельно для молодых (до 21 дня) и зрелых карточек, распределение времени ответа.\n- В JSON добавились: cards[].tags, cards[].exs/exCur, prof[].rt (удержание), rec (карточки с записью), saved (сохранённые поиски), trash[].progs (прогресс всех профилей для удалённых карточек).\n";

    else if(e.target.id==='exin'){e.preventDefault();exCheck()}
  }
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable)return;
  var k=e.key;
  if(k==='Escape'){if(drawerOpen){toggleDrawer(false);e.preventDefault();return}if(drill){drill=null;next();invalidateTab('rev');switchTab('rev');e.preventDefault();return}return}
  if(tab!=='rev'&&tab!=='ex')return;
  if(tab==='ex'&&EX&&!EX.fin){
    var q=EX.q;if(!q)return;
    if(k==='Enter'){if(!q.done){if(q.mode==='type'||q.mode==='dict'){exCheck()}else if(q.mode==='build'){var eb=q.bd;if(eb.pk.length){var eg=eb.pk.map(function(w){return w.w}).join(' ');exAns(nz(eg)===nz(eb.s.join(' ')),eg)}}}else{EX.i++;exNext();var el=document.getElementById('tab-ex');if(el)el.innerHTML=exam()}e.preventDefault();return}
    if(q.mode==='choice'&&!q.done&&/^[1-4]$/.test(k)){var idx=+k-1;if(idx<q.ch.o.length)exAns(idx===q.ch.a,q.ch.o[idx]);e.preventDefault();return}
    if(k===' '&&q.mode==='dict'){say(q.c.en);e.preventDefault();return}
    return;
  }
  if(!cur)return;
  if(k===' '||k==='Spacebar'){e.preventDefault();var c2=false;if(mo()==='speak'){if(checked===null)H.mic();return}
    if(mo()==='flip'&&!flip){flip=true;c2=true}
    else if(mo()==='flip'&&flip&&S.set.revealFirst&&!showAns){showAns=true;c2=true}
    else if(mo()==='choice'&&!ch){ch=mkCh(cur);c2=true}
    else if(mo()==='choice'&&ch&&S.set.revealFirst&&!showAns){showAns=true;c2=true}
    else if(mo()==='type'||mo()==='dict'){if(checked===null){check();return}}
    else if(mo()==='build'){if(checked===null&&bd&&bd.pk.length){checked=nz(bd.pk.map(function(x){return x.w}).join(' '))===nz(bd.s.join(' '));c2=true}}
    if(c2){var rb=document.getElementById('reviewBox');if(rb)rb.innerHTML=review()}
    return;
  }
  if(k==='Enter'){e.preventDefault();var c3=false;
    if(mo()==='type'||mo()==='dict'){if(checked===null)check()}
    else if(mo()==='build'){if(checked===null&&bd&&bd.pk.length){checked=nz(bd.pk.map(function(x){return x.w}).join(' '))===nz(bd.s.join(' '));c3=true}}
    else if(mo()==='flip'){if(!flip){flip=true;c3=true}else if(S.set.revealFirst&&!showAns){showAns=true;c3=true}}
    else if(mo()==='choice'){if(!ch){ch=mkCh(cur);c3=true}else if(S.set.revealFirst&&!showAns){showAns=true;c3=true}}
    if(c3){var rb2=document.getElementById('reviewBox');if(rb2)rb2.innerHTML=review()}
    return}
  if(/^[1-4]$/.test(k)){
    var rating=+k-1;
    var isDone=mo()==='flip'?(flip&&(!S.set.revealFirst||showAns)):mo()==='choice'?(checked!==null):checked!==null;
    if(!isDone)return;
    if(drill&&drill.q){e.preventDefault();if(rating>=2){drill.q.shift();next();var rb=document.getElementById('reviewBox');if(rb)rb.innerHTML=review()}else{drill.q.push(drill.q.shift());next();var rb2=document.getElementById('reviewBox');if(rb2)rb2.innerHTML=review()}return}
    e.preventDefault();rate(rating);return;
  }
  if(k==='u'||k==='U'||k==='й'||k==='Й'){e.preventDefault();undoLast();return}
  if(k==='b'||k==='B'||k==='и'||k==='И'){e.preventDefault();
    if(cur.snz>Date.now()){cur.snz=0;save();var rb=document.getElementById('reviewBox');if(rb)rb.innerHTML=review();toast('Возвращено')}
    else{cur.snz=addD(today(),1);save();next();var sb=document.getElementById('statsBox');if(sb)sb.innerHTML=stats();var rb2=document.getElementById('reviewBox');if(rb2)rb2.innerHTML=review();invalidateExceptRev();updateHeader();updateNavBadges();toast('Отложено до завтра')}
    return}
  if(k==='r'||k==='R'||k==='к'||k==='К'){e.preventDefault();say(cur.en);return}
});

/* v15.2: mobile-first bottom sheets for section drill-down */
var activeSectionSheet=null;
function openSectionSheet(details,summary){
  if(!details||activeSectionSheet)return;
  var label=(summary.textContent||'Раздел').replace(/\s+/g,' ').trim();
  var marker=document.createComment('section-sheet-content-placeholder');
  summary.parentNode.insertBefore(marker,summary.nextSibling);
  var overlay=document.createElement('div');overlay.className='section-sheet-overlay';overlay.setAttribute('role','presentation');
  overlay.innerHTML='<section class="section-sheet" role="dialog" aria-modal="true" aria-label="'+label.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'"><div class="section-sheet-handle" aria-hidden="true"></div><header class="section-sheet-head"><div class="section-sheet-title"></div><button type="button" class="section-sheet-close" aria-label="Закрыть раздел">×</button></header><div class="section-sheet-content"></div></section>';
  var panel=overlay.querySelector('.section-sheet'),content=overlay.querySelector('.section-sheet-content');
  overlay.querySelector('.section-sheet-title').textContent=label;
  while(marker.nextSibling)content.appendChild(marker.nextSibling);
  details.open=false;
  document.body.appendChild(overlay);document.body.classList.add('section-sheet-open');
  var prev=document.activeElement,closed=false;
  var sheetState={overlay:overlay,details:details,marker:marker,content:content,prev:prev};activeSectionSheet=sheetState;
  function close(){
    if(closed)return;closed=true;
    while(content.firstChild)marker.parentNode.insertBefore(content.firstChild,marker);
    if(marker.parentNode)marker.parentNode.removeChild(marker);
    details.open=false;overlay.remove();document.body.classList.remove('section-sheet-open');
    if(activeSectionSheet===sheetState)activeSectionSheet=null;
    try{if(prev&&prev.focus)prev.focus({preventScroll:true})}catch(e){}
  }
  sheetState.close=close;
  overlay.addEventListener('click',function(e){if(e.target===overlay)close()});
  overlay.querySelector('.section-sheet-close').addEventListener('click',close);
  overlay.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();close();return}if(e.key==='Tab'){var fs=overlay.querySelectorAll('button,input,textarea,select,[tabindex]:not([tabindex="-1"])'),vis=[];for(var i=0;i<fs.length;i++)if(!fs[i].disabled)vis.push(fs[i]);if(vis.length){if(e.shiftKey&&document.activeElement===vis[0]){e.preventDefault();vis[vis.length-1].focus()}else if(!e.shiftKey&&document.activeElement===vis[vis.length-1]){e.preventDefault();vis[0].focus()}}}});
  bindLiquidDrag(panel,{expandedClass:"is-expanded",onClose:close});
  var first=overlay.querySelector('button,input,textarea,select');if(first)setTimeout(function(){try{first.focus({preventScroll:true})}catch(e){}},20);
}
document.addEventListener('click',function(e){
  var summary=e.target&&e.target.closest?e.target.closest('details > summary'):null;
  if(!summary)return;
  var d=summary.parentElement;if(!d||d.tagName!=='DETAILS')return;
  /* Forms, settings and progress are best kept inline: their controls and sticky save dock must remain reachable. */
  if(summary.closest('#tab-all, #tab-add .manual-card-details, #tab-add .bulk-add-details, #tab-set, #tab-st'))return;
  /* Other top-level sections use sheets. Nested disclosures stay inline inside the sheet. */
  if(d.parentElement&&d.parentElement.closest&&d.parentElement.closest('details'))return;
  if(summary.closest('.section-sheet'))return;
  e.preventDefault();e.stopPropagation();openSectionSheet(d,summary);
},true);

boot();
})();
