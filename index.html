<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Карточки">
<meta name="application-name" content="Карточки">
<title>Карточки</title>
<style>
:root{--bg:#faf6f0;--bg2:#f3ebdd;--card:#fff;--ink:#2d2939;--ink2:#565064;--mute:#8f8899;--line:#ebe2d3;--line2:#d9cfbc;--acc:#dc8467;--acc-d:#c46d52;--acc-soft:#f4d3c3;--acc-tint:#fceee4;--ok:#57a173;--ok-soft:#d8ebde;--bad:#c96878;--bad-soft:#f3dae0;--warn:#c98c46;--warn-soft:#f2e3cb;--ach:#f3d99a;--a:#dc8467;--a-d:#c46d52;--b:#f4d3c3;--c:#f3dae0;--d:#f2e3cb;--shadow-sm:0 1px 2px rgba(80,50,40,.06),0 1px 3px rgba(80,50,40,.04);--shadow:0 2px 6px rgba(80,50,40,.06),0 4px 14px rgba(80,50,40,.07);--shadow-lg:0 8px 24px rgba(80,50,40,.12),0 2px 6px rgba(80,50,40,.05);--r-sm:10px;--r:14px;--r-lg:20px;--r-xl:26px;--nav-w:248px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1724;--bg2:#221e2f;--card:#2a2535;--ink:#f5efe5;--ink2:#d0c7dc;--mute:#948aa8;--line:#3a3350;--line2:#4d4567;--acc:#ea9a7a;--acc-d:#f0ab8a;--acc-soft:#4a3228;--acc-tint:#35261f;--ok:#7fc99e;--ok-soft:#1e3529;--bad:#f093a3;--bad-soft:#3a2129;--warn:#f0b970;--warn-soft:#382c1e;--ach:#a58638;--a:#ea9a7a;--a-d:#f0ab8a;--b:#4a3228;--c:#3a2129;--d:#382c1e;--shadow-sm:0 1px 2px rgba(0,0,0,.45);--shadow:0 2px 8px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#1a1724;--bg2:#221e2f;--card:#2a2535;--ink:#f5efe5;--ink2:#d0c7dc;--mute:#948aa8;--line:#3a3350;--line2:#4d4567;--acc:#ea9a7a;--acc-d:#f0ab8a;--acc-soft:#4a3228;--acc-tint:#35261f;--ok:#7fc99e;--ok-soft:#1e3529;--bad:#f093a3;--bad-soft:#3a2129;--warn:#f0b970;--warn-soft:#382c1e;--ach:#a58638;--a:#ea9a7a;--a-d:#f0ab8a;--b:#4a3228;--c:#3a2129;--d:#382c1e;--shadow-sm:0 1px 2px rgba(0,0,0,.45);--shadow:0 2px 8px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain}
body.drawer-open{overflow:hidden}
.app{display:block;min-height:100vh}
.sidenav{display:none}
.main{padding:0 16px 96px;max-width:100%}
.main-inner{max-width:720px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;align-items:stretch;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 16px rgba(80,50,40,.09);z-index:6;border-top:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottomnav{box-shadow:0 -2px 16px rgba(0,0,0,.5)}}
:root[data-theme="dark"] .bottomnav{box-shadow:0 -2px 16px rgba(0,0,0,.5)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 4px;border:0;background:transparent;font:inherit;cursor:pointer;color:var(--mute);font-size:10.5px;border-radius:12px;transition:color .15s;position:relative}
.bn-item.on{color:var(--acc);font-weight:600}
.bn-item.on::before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--acc);border-radius:2px}
.bn-item .ico{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.bn-item svg{width:22px;height:22px}
.bn-badge{position:absolute;top:1px;right:calc(50% - 24px);background:var(--acc);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;min-width:16px;text-align:center}
@media (min-width:820px){.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}.sidenav{display:flex}.bottomnav{display:none}.main{padding:0 32px 40px}.drw-btn{display:none}}
.drw-btn{border:0;background:transparent;font:inherit;cursor:pointer;padding:8px;border-radius:12px;color:var(--ink);line-height:1;display:flex;align-items:center;justify-content:center}
.drw-btn:active{background:var(--line)}
.drw-btn svg{width:22px;height:22px}
.sidenav{flex-direction:column;gap:2px;background:var(--card);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:1px 0 0 var(--line)}
.nav-title{font-size:16px;font-weight:700;padding:8px 14px 16px;color:var(--ink);display:flex;align-items:center;gap:8px}
.nav-title svg{color:var(--acc)}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;border-radius:12px;text-align:left;transition:background .12s}
.nav-item:hover{background:var(--line)}
.nav-item:active{background:var(--line2)}
.nav-item.on{background:var(--acc);color:#fff;font-weight:600;box-shadow:var(--shadow-sm)}
.nav-item .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--line);color:var(--ink2);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;min-width:22px;text-align:center}
.nav-item.on .badge{background:rgba(255,255,255,.28);color:#fff}
.nav-item.install{background:var(--ok);color:#fff;margin-top:8px}
.nav-sep{height:1px;background:var(--line);margin:12px 6px}
.nav-sep-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 14px 4px;font-weight:600}
.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:86vw;background:var(--card);z-index:11;transform:translateX(-100%);transition:transform .24s cubic-bezier(.34,1.1,.64,1);box-shadow:var(--shadow-lg);padding:20px 12px;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.drawer.open{transform:translateX(0)}
@media (min-width:820px){.drawer{display:none}}
.overlay{position:fixed;inset:0;background:rgba(30,20,15,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.overlay.open{opacity:1;pointer-events:auto}
@media (min-width:820px){.overlay{display:none}}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.hdr h1{font-size:20px;margin:0;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ring-wrap{width:56px;height:56px;position:relative;flex-shrink:0}
.ring{display:block;width:56px;height:56px}
.ring circle{transition:stroke-dasharray .4s ease}
.content{padding-bottom:8px}
.row{display:flex;gap:10px;margin-top:14px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.mode.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:flex-start}
.mode.scroll::-webkit-scrollbar{display:none}
.btn,.chip,.tab{border:0;font:inherit;cursor:pointer;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .15s,box-shadow .15s,color .15s}
.btn:active,.chip:active,.tab:active{transform:scale(.96)}
.btn{flex:1;padding:13px 8px;border-radius:var(--r);background:var(--acc);color:#fff;font-weight:600;min-height:48px;box-shadow:var(--shadow-sm)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.btn.b0{background:var(--bad-soft);color:var(--bad)}
.btn.b1{background:var(--warn-soft);color:var(--warn)}
.btn.b2{background:var(--ok-soft);color:var(--ok)}
.btn.b3{background:var(--acc-soft);color:var(--acc-d)}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
.btn kbd{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.12);margin-left:4px;font-family:inherit;font-weight:600;opacity:.75}
.chip{padding:7px 15px;border-radius:20px;background:var(--card);font-size:13px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);border:1px solid var(--line);white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--acc-soft);color:var(--acc-d);border-color:var(--acc);font-weight:600}
.chip.install{background:var(--ok);color:#fff;font-weight:600;border-color:transparent}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid transparent;border-radius:var(--r-sm);padding:11px 14px;margin-top:6px;transition:border .15s,background .15s}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);background:var(--card)}
.card{background:var(--card);border-radius:var(--r-xl);padding:28px 22px;min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;box-shadow:var(--shadow);animation:slideUp .26s cubic-bezier(.22,1,.36,1)}
.swipe-card{touch-action:pan-y;will-change:transform;backface-visibility:hidden;-webkit-user-select:none;user-select:none}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flipIn{from{opacity:.5;transform:rotateY(70deg)}to{opacity:1;transform:rotateY(0)}}
.flip-anim{animation:flipIn .32s cubic-bezier(.22,1,.36,1);transform-origin:center}
.tag{font-size:12px;color:var(--mute);letter-spacing:.01em}
.big{font-size:26px;font-weight:700;line-height:1.3}
.big.sm{font-size:20px;color:var(--ok);font-weight:600}
.ex{color:var(--mute);font-size:15px;line-height:1.5}
.empty{text-align:center;padding:30px 20px}
.empty-state{padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:slideUp .3s ease}
.empty-emoji{width:84px;height:84px;border-radius:50%;background:var(--acc-tint);display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1;margin-bottom:2px}
.empty-title{font-size:20px;font-weight:700;color:var(--ink);line-height:1.3}
.empty-text{color:var(--mute);font-size:14px;line-height:1.5;max-width:340px}
.tile{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s;animation:slideUp .22s ease-out}
.tile:active{transform:scale(.985)}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.tile-en{font-size:17px;font-weight:700;line-height:1.3;word-break:break-word}
.tile-ru{color:var(--ink2);font-size:14px;margin-bottom:4px;line-height:1.4}
.tile-meta{font-size:11.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tile-meta .badge{background:var(--line);padding:1px 8px;border-radius:8px;font-weight:600}
.tile-meta .st-new{background:var(--line);color:var(--ink2)}
.tile-meta .st-learn{background:var(--warn-soft);color:var(--warn)}
.tile-meta .st-rev{background:var(--ok-soft);color:var(--ok)}
.tile-meta .st-mature{background:var(--acc-soft);color:var(--acc-d);font-weight:700}
.tile-meta .st-relearn{background:var(--bad-soft);color:var(--bad)}
.tile-actions{display:flex;gap:6px;flex-shrink:0}
.tile-actions .chip{padding:5px 9px;font-size:13px;min-height:30px;box-shadow:none;background:var(--bg2);color:var(--ink2);border-color:transparent}
.tile-actions .chip svg{width:15px;height:15px;display:block}
.item{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm)}
.item small{color:var(--mute)}
.lv{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--line);color:var(--ink2);white-space:nowrap;align-self:flex-start;font-weight:600}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.acts .chip{padding:4px 9px;min-height:28px;background:var(--bg2);box-shadow:none}
details{background:var(--card);border-radius:var(--r);padding:0 16px;margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--line)}
details > summary{cursor:pointer;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
details[open] > summary::after{transform:rotate(45deg);margin-top:-3px}
details > *:not(summary){padding-bottom:14px}
details[open] > summary{padding-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:var(--r);padding:12px 6px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.st b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.st span{font-size:11px;color:var(--mute);display:block;margin-top:4px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-bottom:16px}
.bar i{display:block;transition:width .35s ease}
.session{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--mute)}
.session-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.session-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s ease;border-radius:4px}
.chart{display:flex;gap:4px;align-items:flex-end;background:var(--bg2);border-radius:var(--r);padding:14px 10px 6px;margin-bottom:12px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:104px}
.cb i{display:block;width:100%;max-width:22px;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px;transition:height .35s}
.cb span{font-size:10px;color:var(--mute);text-align:center;line-height:1.2;margin-top:4px}
.cal{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;gap:3px;margin-bottom:14px;overflow-x:auto;background:var(--bg2);border-radius:var(--r);padding:12px}
.cal i{display:block;width:15px;height:15px;border-radius:4px;transition:transform .12s}
.cal i:hover{transform:scale(1.25)}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
.tb th,.tb td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tb th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.ach{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ach-item{padding:7px 12px;background:var(--bg2);border-radius:11px;font-size:12px;transition:transform .15s;border:1px solid var(--line)}
.ach-item.on{background:var(--ach);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);border-color:transparent}
.ach-item.off{opacity:.42}
.rep-preview{font-size:12px;color:var(--mute);margin-top:8px;min-height:10px}
.rep-item{padding:3px 9px;background:var(--bad-soft);border-radius:8px;display:inline-block;margin:3px;color:var(--bad);font-weight:500}
.smart{display:flex;flex-wrap:nowrap;gap:8px;margin:12px -16px;padding:2px 16px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.smart::-webkit-scrollbar{display:none}
.bulk-bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--card);border-radius:var(--r);margin-bottom:10px;align-items:center;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.wr{background:var(--acc-soft);padding:12px 14px;border-radius:var(--r);color:var(--ink);font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--shadow-sm);animation:slideUp .3s ease}
.note{color:var(--mute);font-size:13px;margin:10px 2px}
.fld{margin-bottom:10px}
.fld label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
.my{margin-top:10px;text-align:left}
.my label{font-size:12px;color:var(--mute);font-weight:600}
.ans{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:38px;margin:8px 0}
.dup-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bl{display:inline-block;border-bottom:2px solid var(--acc);color:transparent;min-width:3em;user-select:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:opacity .22s,transform .22s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:20;max-width:88vw;text-align:center;box-shadow:var(--shadow-lg);font-weight:500}
@media (min-width:820px){.toast{bottom:28px}}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.prof-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 8px}
.prof-chips .chip{padding:5px 11px;font-size:12px;min-height:28px}
.forecast{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -4px;text-align:left;-webkit-overflow-scrolling:touch}
.forecast::-webkit-scrollbar{height:0}
.fc-item{flex:0 0 auto;min-width:70px;background:var(--card);border-radius:12px;padding:10px 12px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.fc-item b{display:block;font-size:20px;font-weight:800;color:var(--ink);line-height:1.1}
.fc-item span{font-size:11px;color:var(--mute);white-space:nowrap;display:block;margin-top:2px}
.fc-item.z{opacity:.42}
.fc-item.z b{color:var(--mute);font-weight:600}
#loadOv{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100;transition:opacity .3s}
#loadOv.hide{opacity:0;pointer-events:none}
#loadOv .sp{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadOv .txt{color:var(--mute);font-size:14px}
.store-info{background:var(--bg2);border-radius:var(--r-sm);padding:8px 12px;font-size:12px;color:var(--mute);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line)}
.store-info b{color:var(--ink);font-weight:600}
.store-info .chip{min-height:26px;padding:4px 10px;font-size:12px}
kbd{display:inline-block;padding:1px 6px;background:var(--bg2);border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);box-shadow:0 1px 0 var(--line2);margin:0 2px}
.tab-pane{animation:slideUp .2s ease-out}
#swipeHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);padding:16px 26px;border-radius:18px;font-size:17px;font-weight:700;color:#fff;opacity:0;transition:opacity .1s,transform .12s cubic-bezier(.22,1,.36,1);pointer-events:none;z-index:15;box-shadow:0 12px 32px rgba(0,0,0,.25);white-space:nowrap}
#swipeHint.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#swipeHint.again{background:var(--bad)}
#swipeHint.good{background:var(--ok)}

var AIP="Ты — помощник для изучения иностранного языка по аутентичным материалам (сериалы, фильмы, подкасты, книги, статьи). Я русскоязычный ученик (уровень B1–B2).\nНиже я дам транскрипцию, субтитры (.srt) или фрагмент текста. Выбери из них 30–40 самых полезных выражений и выдай готовый блок для импорта в моё приложение с карточками.\n\nЧТО ВЫБИРАТЬ (по приоритету): идиомы и устойчивые выражения; полезные конструкции и разговорные формы (gonna, gotta, \"you were supposed to…\"); фразовые глаголы; частотные слова и фразы для живой речи.\nНЕ БРАТЬ: имена, редкие слова, шутки, непонятные без картинки, нецензурную лексику, слова песен (строки с ♪).\n\nФОРМАТ ВЫВОДА: только один блок кода, одна строка на фразу, без нумерации, заголовков и пояснений. Формат строки:\nфраза | перевод | пример | тип | | сцена\n\nПРАВИЛА ДЛЯ ПОЛЕЙ:\n1. фраза: короткий устойчивый фрагмент (2–6 слов), строчными буквами, без точки.\n2. перевод: естественный русский перевод по смыслу, 1–6 слов.\n3. пример: короткое предложение (4–10 слов), содержит «фразу».\n4. тип: идиома, конструкция, глагол, слово, фраза.\n5. пятое поле пустое, разделители | сохрани.\n6. сцена: источник и место («S1E2 12:40» или «Chapter 3 p.45»).\n7. Без дубликатов. Не используй символ | внутри полей.\n\nВ конце одной строкой напиши название источника.\n\nМатериал:\n<вставьте текст или .srt>",AIN="# Инструкция для нейросети: приложение «Карточки»\n\n## 1. Что это и для кого\nОдностраничное веб-приложение для изучения языка по сериалам, фильмам, подкастам и текстам. Карточки повторяются по интервальной системе как в Anki. Пользователь русскоязычный. Данные хранятся в браузере (IndexedDB, запасной вариант localStorage). Есть резервные копии JSON, слияние копий, авто-бэкапы, корзина, диагностика и журнал ошибок.\n\n## 2. Твоя задача\nИз транскрипции, субтитров или текста выбрать полезные выражения и выдать блок для импорта (раздел 3). Также можно: перевести фразы, придумать примеры и мнемоники, разобрать трудные карточки, подготовить данные для импорта или правки.\n\n## 3. Формат импорта (вкладка «Добавить»)\nОдна строка = одна карточка, разделитель « | »:\nфраза | перевод | пример | тип | мой пример | сцена\n- Обязательны первые два поля. Название колоды вписывается отдельно: «Show S1E2» (папка = часть до S1E2) или «Папка :: серия».\n- фраза: 2–6 слов, строчными, как звучит в источнике, без точки на конце.\n- перевод: по-русски, по смыслу в контексте; для конструкций шаблон («тебе придётся + глагол»).\n- пример: короткое предложение, которое дословно содержит «фразу» (иначе режим «Написать» не сделает пропуск).\n- тип: идиома, конструкция, глагол, слово, фраза.\n- мой пример: оставляй пустым (заполняет пользователь), но сохраняй разделитель.\n- сцена: название серии и таймкод, например S1E2 12:40.\n- Если в колоде уже есть карточка с такой фразой и переводом «⟨перевести⟩», новый перевод подставится в неё.\nВывод: один блок кода без нумерации, заголовков и пояснений; в конце строка с названием колоды.\n\n## 4. Правила качества\n- Приоритет: идиомы, конструкции, разговорные формы (gonna, gotta), фразовые глаголы, полезные слова уровня B1–B2.\n- Не брать: имена, редкие слова, шутки, зависящие от картинки, нецензурную лексику, строки песен.\n- 30–40 фраз на серию длиной около 22 минут; без дубликатов; уже имеющиеся фразы пропускать.\n- Примеры пиши сам. Не воспроизводи реплики и тексты песен целиком: они защищены авторским правом.\n\n## 5. Импорт из субтитров прямо в приложении\nВкладка «Добавить» → «Импорт из субтитров (.srt)». Файл разбирается на устройстве: убираются теги, звуки и строки песен, ищутся разговорные формы, фразовые глаголы, идиомы и повторяющиеся словосочетания. Пользователь отмечает кандидатов; карточки добавляются с переводом «⟨перевести⟩», таймкодом в поле «сцена» и (по желанию) репликой как примером. Кнопка «Скопировать для перевода» готовит текст для нейросети: нужно перевести поле «перевод» и вернуть те же строки.\n\n## 6. Как устроено приложение\n- Вкладки: Повтор, Колода, Перед (шпаргалка), Экзамен, Добавить, 📊 статистика, ⚙ настройки, ❓ справка.\n- Режимы повторения: Узнать (EN→RU или RU→EN), Написать (прощает одну опечатку), Диктант, Собрать, Выбор, 🎲 Микс.\n- Алгоритм как в Anki v2: шаги обучения 1 и 10 мин; интервал после обучения 1 день; «Легко» у новой 4 дня; лёгкость 250%; бонус «Легко» 130%; множитель «Трудно» 120%. Просрочка: «Трудно» (интервал + просрочка/4)·1,2; «Хорошо» (интервал + просрочка/2)·лёгкость; «Легко» (интервал + просрочка)·лёгкость·бонус. Лёгкость: «Снова» −20%, «Трудно» −15%, «Легко» +15%, минимум 130%. После ошибки карточка проходит переобучение (1 или 2 «Хорошо» в зависимости от настройки).\n- Пиявки: после порога ошибок (по умолчанию 8) карточка откладывается, ведётся отдельный счётчик пиявок (lch), число ошибок сохраняется.\n- Мягкий режим после перерыва: если пользователь не заходил N дней (по умолчанию 5) и просрочено больше лимита, показывается не больше M повторов в день (по умолчанию 40), сначала самые старые, новые карточки на паузе; режим выключается сам.\n- Лимиты: новых и повторов в день, отдельный лимит новых для каждой колоды.\n- Профили: набор фраз общий; прогресс, настройки, примеры, заметки, экзамены и достижения у каждого профиля свои.\n- Работа с карточкой: фокус-режим скрывает статистику и вспомогательные кнопки (кнопка «⋯» раскрывает их); ответ и кнопки оценки появляются сразу после нажатия на карточку; «Мой пример» и «Заметка» свёрнуты и раскрываются по нажатию.\n- Колоды и папки, смарт-колоды, массовые действия, поиск и слияние дубликатов, достижения, напоминание о перерыве, вибрация, отмена до 10 ответов, свайпы и горячие клавиши.\n- Экзамен: без влияния на расписание; выбор одной или нескольких колод, число вопросов, типы заданий, таймер, показ ответа сразу.\n- Надёжность: запрос постоянного хранилища; скачивание и загрузка JSON; слияние копий (новые карточки добавляются, берётся более свежий прогресс); авто-бэкапы в IndexedDB (3 последних); отмена последнего восстановления или сброса; корзина (30 дней) для удалённых карточек, колод и профилей; диагностика (поиск и починка битых данных); журнал ошибок; офлайн-режим через Service Worker (файл sw.js рядом с index.html).\n\n## 7. Структура JSON резервной копии (схема 3)\n{ cards: [{u, id, en, ru, ex, t, src, sc}], prof: {<id>: {name, prog: {<u>: {state, step, ease, ivl, due, reps, lapses, my, note, star, snz, tm, tn, susp, rstep, lch}}, log, ok, nn, rr, set, lim, sel, typ, starOnly, ex, xc, ach, cu, lo}}, pid, theme, trash, schema, seeded }\nПоля: u — постоянный идентификатор карточки; id = «колода|фраза строчными»; state: 0 новая, 1 учится, 2 повтор, 3 заново; ivl в днях; ease: 2.5 = 250%; due — время в миллисекундах; lch — сколько раз карточка становилась пиявкой. Не меняй u и ключи prog без необходимости; после правки JSON должен остаться валидным.\n\n## 8. Шаблон промпта для извлечения фраз из транскрипции\n(пользователь вставляет его в чат вместе с субтитрами; тот же текст лежит в приложении на вкладке «Добавить»)\n\n"+AIP;

document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable)return;
  var k=e.key;
  if(k==='Escape'){if(drawerOpen){toggleDrawer(false);e.preventDefault();return}if(drill){drill=null;next();invalidateTab('rev');switchTab('rev');e.preventDefault();return}return}
  if(tab!=='rev'&&tab!=='ex')return;
  if(tab==='ex'&&EX&&!EX.fin){
    var q=EX.q;if(!q)return;
    if(k==='Enter'){if(!q.done){if(q.mode==='type'||q.mode==='dict'){exCheck()}else if(q.mode==='build'){var eb=q.bd;if(eb.pk.length){var eg=eb.pk.map(function(w){return w.w}).join(' ');exAns(nz(eg)===nz(eb.s.join(' ')),eg)}}}else{EX.i++;exNext();var el=document.getElementById('tab-ex');if(el)el.innerHTML=exam()}e.preventDefault();return}
    if(q.mode==='choice'&&!q.done&&/^[1-4]$/.test(k)){var idx=+k-1;if(idx<q.ch.o.length)exAns(idx===q.ch.a,q.ch.o[idx]);e.preventDefault();return}
    if(k===' '&&q.mode==='dict'){say(q.c.en);e.preventDefault();return}
    return;
  }
  if(!cur)return;
  if(k===' '||k==='Spacebar'){e.preventDefault();var c2=false;
    if(mo()==='flip'&&!flip){flip=true;c2=true}
    else if(mo()==='flip'&&flip&&S.set.revealFirst&&!showAns){showAns=true;c2=true}
    else if(mo()==='choice'&&!ch){ch=mkCh(cur);c2=true}
    else if(mo()==='choice'&&ch&&S.set.revealFirst&&!showAns){showAns=true;c2=true}
    else if(mo()==='type'||mo()==='dict'){if(checked===null){check();return}}
    else if(mo()==='build'){if(checked===null&&bd&&bd.pk.length){checked=nz(bd.pk.map(function(x){return x.w}).join(' '))===nz(bd.s.join(' '));c2=true}}
    if(c2){var rb=document.getElementById('reviewBox');if(rb)rb.innerHTML=review()}
    return;
  }
  if(k==='Enter'){e.preventDefault();var c3=false;
    if(mo()==='type'||mo()==='dict'){if(checked===null)check()}
    else if(mo()==='build'){if(checked===null&&bd&&bd.pk.length){checked=nz(bd.pk.map(function(x){return x.w}).join(' '))===nz(bd.s.join(' '));c3=true}}
    else if(mo()==='flip'){if(!flip){flip=true;c3=true}else if(S.set.revealFirst&&!showAns){showAns=true;c3=true}}
    else if(mo()==='choice'){if(!ch){ch=mkCh(cur);c3=true}else if(S.set.revealFirst&&!showAns){showAns=true;c3=true}}
    if(c3){var rb2=document.getElementById('reviewBox');if(rb2)rb2.innerHTML=review()}
    return}
  if(/^[1-4]$/.test(k)){
    var rating=+k-1;
    var isDone=mo()==='flip'?(flip&&(!S.set.revealFirst||showAns)):mo()==='choice'?(checked!==null):checked!==null;
    if(!isDone)return;
    if(drill&&drill.q){e.preventDefault();if(rating>=2){drill.q.shift();next();var rb=document.getElementById('reviewBox');if(rb)rb.innerHTML=review()}else{drill.q.push(drill.q.shift());next();var rb2=document.getElementById('reviewBox');if(rb2)rb2.innerHTML=review()}return}
    e.preventDefault();rate(rating);return;
  }
  if(k==='u'||k==='U'||k==='й'||k==='Й'){e.preventDefault();undoLast();return}
  if(k==='b'||k==='B'||k==='и'||k==='И'){e.preventDefault();
    if(cur.snz>Date.now()){cur.snz=0;save();var rb=document.getElementById('reviewBox');if(rb)rb.innerHTML=review();toast('Возвращено')}

    return}
  if(k==='r'||k==='R'||k==='к'||k==='К'){e.preventDefault();say(cur.en);return}
});
