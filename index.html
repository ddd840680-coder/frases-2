ника, например: Charlie S1E2 или Chapter 3\n\nМатериал:\n<вставьте сюда текст или .srt>",AIN="# Инструкция для нейросети: приложение «Карточки»\n\n## 1. Что это\nУниверсальное одностраничное веб-приложение для изучения материала через карточки в стиле Anki. Работает для любого контента: сериалы, книги, подкасты, статьи, уроки. Данные в браузере.\n\n## 2. Задача\nИз текста/субтитров выделить 30–40 полезных фраз и выдать блок для импорта. Также: улучшить переводы, придумать примеры, разобрать трудные карточки.\n\n## 3. Формат импорта\nфраза | перевод | пример | тип | мой пример | сцена\n\n## 4. Правила\nНе брать: имена, редкие слова, шутки, мат, песни.\n\n## 5. Функции\n- Вкладки: Повтор, Колода, Перед, Экзамен, Добавить, 📊, ⚙, ❓.\n- Режимы: Узнать, Написать, Диктант, Собрать (сборка ФРАЗЫ c.en), Выбор, Микс.\n- Смарт-колоды: 🔥 Трудные, 🩸 Пиявки, ⭐ Избранные, 🆕 Новые, 📭 Забытые, 1️⃣ Однословные, 🧩 Идиомы, 🔤 Глаголы.\n- Массовое редактирование, ачивки, отчёты, авто-бэкап, валидация JSON.\n- Папки: три формата разделителя — `Folder::Item`, `Folder Item 1`, `Folder 1`. Пример: `Charlie::S1E1`, `Charlie S1E1`, `Chapter 3` → папки Charlie/Charlie/Chapter.\n- Дубликаты: точные + 1 опечатка. Кнопка «Объединить» сливает группу в одну карточку.\n- Название приложения меняется в ⚙.\n- Резерв: JSON, для Anki (TSV).\n";
